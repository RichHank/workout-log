<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workout Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>Workout Log</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #222732;
      --panel-3: #101319;
      --text: #f4f7fb;
      --muted: #a1acb8;
      --line: #2c3340;
      --line-strong: #3b4654;
      --accent: #8fb7ff;
      --accent-2: #6ee7b7;
      --accent-3: #ffd08a;
      --danger: #ff8a93;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      --radius: 8px;
      --tap: 46px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #111318 0%, #0f1115 100%);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #111318;
      color: var(--text);
      outline: none;
      padding: 10px 12px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(143, 183, 255, 0.16);
    }

    textarea {
      resize: vertical;
      min-height: 86px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      width: min(100%, 980px);
      margin: 0 auto;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0 10px;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: var(--text);
      color: #111318;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.2;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn,
    .mini-btn {
      width: var(--tap);
      height: var(--tap);
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    }

    .mini-btn {
      width: 40px;
      height: 40px;
    }

    .mini-btn.primary {
      background: var(--text);
      color: #111318;
      border-color: var(--text);
    }

    .mini-btn.danger {
      color: var(--danger);
      background: transparent;
      border-color: rgba(255, 138, 147, 0.42);
    }

    .icon-btn:active,
    .mini-btn:active,
    .primary-btn:active,
    .ghost-btn:active,
    .segmented button:active {
      transform: translateY(1px);
    }

    svg {
      width: 19px;
      height: 19px;
      stroke-width: 2;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin: 6px 0 14px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(6, minmax(82px, 1fr));
      gap: 4px;
      padding: 4px;
      overflow-x: auto;
      border-radius: var(--radius);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .segmented button {
      min-height: 40px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .segmented button[aria-selected="true"] {
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .day-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
      gap: 7px;
    }

    .day-strip button {
      min-height: 58px;
      padding: 7px 5px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      display: grid;
      gap: 2px;
      justify-items: center;
    }

    .day-strip button strong {
      color: inherit;
      font-size: 0.84rem;
    }

    .day-strip button span {
      font-size: 0.7rem;
      line-height: 1.1;
    }

    .day-strip button[aria-current="true"] {
      background: var(--text);
      color: #111318;
      border-color: var(--text);
      box-shadow: var(--shadow);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 12px;
    }

    .metric,
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.12);
    }

    .metric {
      min-height: 68px;
      padding: 10px;
      display: grid;
      align-content: center;
      gap: 2px;
    }

    .metric b {
      font-size: 1.24rem;
      line-height: 1;
    }

    .metric span,
    .muted {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.25;
    }

    .voice-panel {
      padding: 12px;
      margin: 0 0 12px;
    }

    .voice-grid {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
    }

    .voice-grid textarea {
      min-height: 46px;
      height: 46px;
      max-height: 120px;
      padding-top: 11px;
    }

    .primary-btn,
    .ghost-btn {
      min-height: var(--tap);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius);
      padding: 0 13px;
      font-weight: 800;
    }

    .primary-btn {
      background: var(--accent);
      color: #08111f;
      box-shadow: 0 12px 26px rgba(143, 183, 255, 0.18);
    }

    .ghost-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .ghost-btn.danger {
      color: var(--danger);
      border-color: rgba(255, 138, 147, 0.42);
    }

    .status-line,
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-line {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.78rem;
      min-height: 19px;
    }

    .list,
    .stack {
      display: grid;
      gap: 10px;
    }

    .exercise,
    .day-card {
      overflow: hidden;
    }

    .exercise-head,
    .card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 13px 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    .exercise-title h2,
    .card-head h2,
    .section-title h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.18;
    }

    .target,
    .chip-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      background: #253142;
      color: #c7d7ea;
    }

    .pill.press,
    .pill.compound {
      background: #153150;
      color: #b8d9ff;
    }

    .pill.pull,
    .pill.isolation {
      background: #153323;
      color: #bdf3d0;
    }

    .pill.logged,
    .pill.hinge {
      background: #3a2913;
      color: #ffd79a;
    }

    .set-form,
    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px 70px minmax(76px, 1fr) auto;
      gap: 7px;
      padding: 10px 12px;
      align-items: end;
      border-bottom: 1px solid var(--line);
    }

    .form-grid {
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      border-bottom: 0;
      padding: 0;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1;
      margin: 0 0 5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      min-height: 42px;
      padding: 8px 10px;
    }

    .sets {
      display: grid;
    }

    .set-row,
    .block-row,
    .exercise-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .block-row,
    .exercise-row {
      grid-template-columns: 1fr auto;
    }

    .set-row:last-child,
    .block-row:last-child,
    .exercise-row:last-child {
      border-bottom: 0;
    }

    .set-num {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 900;
      font-size: 0.76rem;
    }

    .set-main,
    .row-main {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .set-main b,
    .row-main b {
      font-size: 0.92rem;
      line-height: 1.15;
    }

    .set-main span,
    .row-main span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.15;
    }

    .empty {
      min-height: 86px;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .section-title {
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .actions,
    .export-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin: 0 0 12px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    th,
    td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      background: var(--panel-3);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }

    .chart-card {
      padding: 12px;
    }

    .chart-card canvas {
      width: 100%;
      height: 160px;
      display: block;
      margin-top: 8px;
    }

    .note-panel {
      padding: 12px;
      margin: 0 0 12px;
    }

    .note-panel textarea {
      margin-top: 8px;
      min-height: 92px;
    }

    .session-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .standards-list {
      display: grid;
      gap: 10px;
    }

    .standard-card {
      padding: 12px;
    }

    .standard-bar {
      position: relative;
      height: 18px;
      margin: 12px 0 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #253142 0 20%, #153150 20% 40%, #153323 40% 60%, #3a2913 60% 80%, #4b1d2b 80% 100%);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .standard-marker {
      position: absolute;
      top: -6px;
      width: 4px;
      height: 30px;
      border-radius: 999px;
      background: var(--text);
      box-shadow: 0 0 0 2px #111318;
    }

    .standard-levels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.15;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.58);
      padding: 14px;
    }

    .modal.show {
      display: flex;
    }

    .modal-panel {
      width: min(100%, 620px);
      max-height: min(88vh, 760px);
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .rest-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(72px + env(safe-area-inset-bottom));
      z-index: 25;
      display: none;
      padding: 8px max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
    }

    .rest-bar.show {
      display: block;
    }

    .rest-inner {
      width: min(100%, 980px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr repeat(4, auto);
      gap: 7px;
      align-items: center;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #111318;
      box-shadow: var(--shadow);
      padding: 8px;
    }

    .rest-time {
      font-weight: 900;
      color: var(--accent-2);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 8px max(14px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
    }

    .bottom-nav-inner {
      width: min(100%, 980px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .bottom-nav button {
      min-height: 52px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .bottom-nav button[aria-selected="true"] {
      color: #111318;
      background: var(--text);
      border-color: var(--text);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(132px + env(safe-area-inset-bottom));
      z-index: 50;
      transform: translateX(-50%) translateY(18px);
      width: min(calc(100% - 28px), 520px);
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--text);
      color: #111318;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      font-size: 0.9rem;
      line-height: 1.25;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .toast button {
      margin-left: 8px;
      color: #111318;
      font-weight: 900;
      text-decoration: underline;
      background: transparent;
    }

    [draggable="true"] {
      cursor: grab;
    }

    @media (min-width: 720px) {
      .shell {
        padding-left: 22px;
        padding-right: 22px;
      }

      .toolbar {
        grid-template-columns: 1.5fr 1fr;
        align-items: start;
      }

      .day-strip {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .set-form {
        grid-template-columns: 1fr 58px 58px auto;
      }

      .set-form .notes-field {
        grid-column: 1 / -1;
      }

      .bottom-nav-inner {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .rest-inner {
        grid-template-columns: 1fr repeat(2, auto);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6 8v8M18 8v8M3.5 10.5v3M20.5 10.5v3M6 12h12" stroke="currentColor" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Workout Log</h1>
          <p id="headline">Ready</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost-btn" id="editPlanBtn" type="button">Edit Plan</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="segmented" role="tablist" aria-label="Views" id="topTabs"></div>
      <div class="date-row">
        <label class="sr-only" for="workoutDate">Workout date</label>
        <input id="workoutDate" type="date">
        <button class="ghost-btn" id="todayBtn" type="button">Today</button>
      </div>
      <div class="day-strip" id="dayStrip" aria-label="Workout day"></div>
    </div>

    <main id="app"></main>
  </div>

  <div class="rest-bar" id="restBar"></div>
  <nav class="bottom-nav" aria-label="Primary">
    <div class="bottom-nav-inner" id="bottomTabs"></div>
  </nav>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "workout-log-v2";
    const LEGACY_STORAGE_KEY = "workout-log-v1";
    const DB_NAME = "workout-log-db";
    const DB_VERSION = 2;
    const DB_STORE = "keyval";
    const GIST_FILE = "workout-log-state.json";

    const views = [
      ["log", "Log", "plus"],
      ["progress", "Stats", "chart"],
      ["plan", "Plan", "calendar"],
      ["exercises", "Exercises", "dumbbell"],
      ["export", "Export", "download"],
      ["sync", "Sync", "cloud"]
    ];

    const icons = {
      plus: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-linecap="round"/></svg>',
      mic: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" stroke="currentColor"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3M9 21h6" stroke="currentColor" stroke-linecap="round"/></svg>',
      stop: '<svg viewBox="0 0 24 24" fill="none"><path d="M8 8h8v8H8z" stroke="currentColor" stroke-linejoin="round"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7l1-3h4l1 3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4v10M8 10l4 4 4-4M5 20h14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      upload: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 20V10M8 14l4-4 4 4M5 20h14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>',

    function ex(id, name, primary, secondary, pattern, rest, sets, reps, aliases = []) {

    function createProgramFromTemplate(name, split, daysPerWeek, exercises) {
      const map = Object.fromEntries(exercises.map((item) => [item.id, item]));
      const templates = {
        "Upper/Lower": [
          ["Upper A", ["bench-press", "incline-db-press", "lat-pulldown-close", "seated-cable-row", "barbell-curl", "hammer-curl"]],
          ["Lower A", ["front-squat", "leg-press", "leg-extension", "romanian-deadlift", "leg-curl", "standing-calf-raise"]],
          ["Upper B", ["overhead-press", "lateral-raise", "lat-pulldown-wide", "wide-cable-row", "tricep-pushdown", "overhead-tricep-extension"]],
          ["Lower B", ["deadlift", "bulgarian-split-squat", "hip-thrust", "leg-curl", "leg-extension", "standing-calf-raise"]]
        ],
        "Push/Pull/Legs": [
          ["Push", ["bench-press", "incline-db-press", "overhead-press", "lateral-raise", "tricep-pushdown"]],
          ["Pull", ["deadlift", "lat-pulldown-wide", "seated-cable-row", "barbell-curl", "hammer-curl"]],
          ["Legs", ["front-squat", "leg-press", "romanian-deadlift", "leg-curl", "standing-calf-raise"]]
        ],
        "Full Body": [
          ["Full A", ["front-squat", "bench-press", "seated-cable-row", "leg-curl"]],
          ["Full B", ["deadlift", "overhead-press", "lat-pulldown-wide", "leg-extension"]],
          ["Full C", ["leg-press", "incline-db-press", "wide-cable-row", "standing-calf-raise"]]
        ],
        "Bro Split": [
          ["Chest", ["bench-press", "incline-db-press"]],
          ["Back", ["deadlift", "lat-pulldown-wide", "seated-cable-row"]],
          ["Shoulders", ["overhead-press", "lateral-raise"]],
          ["Arms", ["barbell-curl", "hammer-curl", "tricep-pushdown"]],
          ["Legs", ["front-squat", "leg-press", "romanian-deadlift"]]
        ]
      };
      const source = split === "Custom" ? [] : templates[split] || templates["Upper/Lower"];
      const days = Array.from({ length: daysPerWeek }, (_, index) => {
        const template = source[index % Math.max(source.length, 1)] || [`Day ${index + 1}`, []];
        return {
          id: cryptoId(),
          label: template[0],
          type: "Strength",
          order: index,
          blocks: template[1].filter((id) => map[id]).map((id, blockIndex) => blockFromExercise(map[id], blockIndex))
        };
      });
      return { id: cryptoId(), name, split, days, created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
    }

    function blockFromExercise(exercise, order = 0) {
      return {
        id: cryptoId(),
        exercise_id: exercise.id,
        sets: exercise.default_sets || 3,
        rep_range: exercise.default_rep_range || "8-12",
        rest_seconds: exercise.default_rest_seconds || 120,
        order,
        updated_at: new Date().toISOString()
      };
    }

    async function loadState() {
      const saved = await readStoredState();
      return normalizeState(saved);
    }

    async function readStoredState() {
      try {
        const saved = await idbGet(STORAGE_KEY);
        if (saved) return saved;
      } catch {
        // Fall back below.
      }

      for (const key of [STORAGE_KEY, LEGACY_STORAGE_KEY]) {
        try {
          const saved = JSON.parse(localStorage.getItem(key));
          if (saved) return saved;
        } catch {
          // Try the next key.
        }
      }
      return null;
    }

    function normalizeState(saved) {
      const fallback = createDefaultState();
      if (!saved || typeof saved !== "object") return fallback;
      if (saved.schema_version === 2) {
        const merged = { ...fallback, ...saved };
        merged.exercises = mergeById(fallback.exercises, saved.exercises || []);
        merged.programs = saved.programs?.length ? saved.programs : fallback.programs;
        merged.sessions = saved.sessions || [];
        merged.sets = saved.sets || [];
        merged.settings = { ...fallback.settings, ...(saved.settings || {}), sync: { ...fallback.settings.sync, ...(saved.settings?.sync || {}) } };
        merged.profile = { ...fallback.profile, ...(saved.profile || {}) };
        if (!merged.activeProgramId || !getProgram(merged.activeProgramId, merged)) merged.activeProgramId = merged.programs[0]?.id;
        if (!merged.activeDayId || !getDay(merged.activeDayId, merged)) merged.activeDayId = merged.programs[0]?.days[0]?.id;
        return merged;
      }
      return migrateLegacyState(saved, fallback);
    }

    function migrateLegacyState(saved, fallback) {
      const sets = (saved.logs || []).map((log) => ({
        id: log.id || cryptoId(),
        session_id: `${log.date}-${log.workoutId || "legacy"}`,
        date: log.date || todayISO(),
        exercise_id: log.exerciseId || slug(log.exerciseName || "Exercise"),
        exercise: log.exerciseName || "Exercise",
        set_number: Number(log.setNumber || 1),
        reps: Number(log.reps || 0),
        weight_lb: parseWeight(log.weight),
        rpe: log.rir ? String(10 - Number(log.rir)) : "",
        notes: log.notes || "",
        created_at: log.createdAt || new Date().toISOString(),
        updated_at: log.createdAt || new Date().toISOString()
      }));
      const sessions = [...new Map(sets.map((set) => [set.session_id, {
        id: set.session_id,
        date: set.date,
        program_id: fallback.activeProgramId,
        day_id: fallback.activeDayId,
        started_at: set.created_at,
        updated_at: set.updated_at
      }])).values()];
      return { ...fallback, view: saved.view || "log", activeDate: saved.activeDate || todayISO(), sets, sessions, drafts: saved.drafts || {}, command: saved.command || "" };
    }

    function saveState() {
      const snapshot = JSON.parse(JSON.stringify({ ...state, command: "" }));
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
      } catch {
        // IndexedDB remains the primary cache.
      }
      idbSet(STORAGE_KEY, snapshot).catch(() => {});
    }

    function openAppDB() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function idbGet(key) {
      const db = await openAppDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readonly");
        const request = tx.objectStore(DB_STORE).get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
      });
    }

    async function idbSet(key, value) {
      const db = await openAppDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = () => {
          db.close();
          resolve();
        };
        tx.onerror = () => {
          db.close();
          reject(tx.error);
        };
      });
    }

    function getProgram(id = state.activeProgramId, root = state) {
      return root.programs.find((program) => program.id === id) || root.programs[0];
    }

    function getDay(id = state.activeDayId, root = state) {
      return getProgram(root.activeProgramId, root)?.days.find((day) => day.id === id) || getProgram(root.activeProgramId, root)?.days[0];
    }

    function getExercise(id) {
      return state.exercises.find((item) => item.id === id);
    }

    function todayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function activeSession() {
      const day = getDay();
      let session = state.sessions.find((item) => item.date === state.activeDate && item.day_id === day?.id);
      if (!session) {
        session = {
          id: cryptoId(),
          date: state.activeDate,
          program_id: state.activeProgramId,
          day_id: day?.id,
          started_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
          notes: "",
          timer_started_at: Date.now(),
          timer_paused_at: null,
          paused_total_ms: 0,
          finished_at: null
        };
        state.sessions.push(session);
      }
      return ensureSessionFields(session);
    }

    function ensureSessionFields(session) {
      session.notes ||= "";
      session.timer_started_at ||= new Date(session.started_at || Date.now()).getTime();
      session.paused_total_ms ||= 0;
      if (session.timer_paused_at === undefined) session.timer_paused_at = null;
      if (session.finished_at === undefined) session.finished_at = null;
      return session;
    }

    function activeSets() {
      const day = getDay();
      const sessionIds = state.sessions.filter((item) => item.date === state.activeDate && item.day_id === day?.id).map((item) => item.id);
      return state.sets.filter((set) => sessionIds.includes(set.session_id)).sort(sortRecords);
    }

    function setsForExercise(exerciseId, sessionId = null) {
      return state.sets.filter((set) => set.exercise_id === exerciseId && (!sessionId || set.session_id === sessionId)).sort(sortRecords);
    }

    function weekStartISO(dateISO) {
      const date = new Date(`${dateISO}T12:00:00`);
      const day = date.getDay();
      date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
      return date.toISOString().slice(0, 10);
    }

    function weekSets() {
      const start = new Date(`${weekStartISO(state.activeDate)}T00:00:00`);
      const end = new Date(start);
      end.setDate(end.getDate() + 7);
      return state.sets.filter((set) => {
        const date = new Date(`${set.date}T12:00:00`);
        return date >= start && date < end;
      }).sort(sortRecords);
    }

    function renderBlock(block, sessionId) {
      const exercise = getExercise(block.exercise_id);
      const logs = setsForExercise(block.exercise_id, sessionId);
      const draft = state.drafts[block.id] || {};
      const timing = exerciseTiming(logs, activeSession());
      if (!exercise) return "";
      return `
        <article class="exercise panel">
          <div class="exercise-head">
            <div class="exercise-title">
              <h2>${escapeHtml(exercise.name)}</h2>

    function addSet(blockId) {
      const day = getDay();
      const block = day?.blocks.find((item) => item.id === blockId);
      const exercise = getExercise(block?.exercise_id);
      const draft = state.drafts[blockId] || {};
      if (!block || !exercise) return false;
      const reps = Number(draft.reps);
      const weight = parseWeight(draft.weight_lb);
      if (!Number.isFinite(reps) || reps <= 0 || !Number.isFinite(weight)) return false;
      const session = activeSession();
      const existing = state.sets.filter((set) => set.session_id === session.id && set.exercise_id === exercise.id);
      const now = new Date().toISOString();
      if (session.finished_at) session.finished_at = null;
      if (session.timer_paused_at) {
        session.paused_total_ms += Date.now() - session.timer_paused_at;
        session.timer_paused_at = null;
      }
      state.sets.push({
        id: cryptoId(),
        session_id: session.id,
        date: state.activeDate,
        exercise_id: exercise.id,
        exercise: exercise.name,
        set_number: existing.length + 1,
        reps,
        weight_lb: weight,
        rpe: cleanValue(draft.rpe),
        notes: cleanValue(draft.notes),
        created_at: now,
        updated_at: now
      });
      session.updated_at = now;
      state.drafts[blockId] = { weight_lb: String(weight), reps: "", rpe: draft.rpe || "", notes: "" };
      startRestTimer(block.rest_seconds || exercise.default_rest_seconds || 120);
      render();
      showToast(`${exercise.name}: ${weight} x ${reps}`);
      return true;
    }

    function deleteSet(id) {

      const deleted = state.sets.find((set) => set.id === id);

    }

    function renumberSets(deleted) {
      if (!deleted) return;
      state.sets
        .filter((set) => set.session_id === deleted.session_id && set.exercise_id === deleted.exercise_id)

    function parseCommand(text) {
      const raw = cleanValue(text);
      if (!raw) return { ok: false, message: "No command text." };
      const match = findExercise(raw);
      if (!match) return { ok: false, message: "No matching exercise." };
      const day = getDay();
      let block = day.blocks.find((item) => item.exercise_id === match.exercise.id);
      if (!block) {
        block = blockFromExercise(match.exercise, day.blocks.length);
        day.blocks.push(block);
      }
      const sets = extractSets(raw, match.alias);
      if (!sets.length) return { ok: false, message: "No weight and reps found." };
      sets.forEach((item) => {
        state.drafts[block.id] = { weight_lb: item.weight_lb, reps: item.reps, rpe: item.rpe || "", notes: item.notes || "" };
        addSet(block.id);
      });
      state.command = "";
      return { ok: true, message: `${sets.length} set${sets.length === 1 ? "" : "s"} added.` };
    }

    function findExercise(text) {
      const normalized = normalizeText(text);
      const matches = [];
      state.exercises.forEach((exercise) => {
        [exercise.name, ...(exercise.aliases || [])].map(normalizeText).forEach((alias) => {
          if (normalized.includes(alias)) matches.push({ exercise, alias, score: alias.length });
        });
      });
      matches.sort((a, b) => b.score - a.score);
      return matches[0] || null;
    }

    function extractSets(text, alias) {
      let body = normalizeText(text)
        .replace(alias, " ")
        .replace(/\b(add|set|sets|logged|log|did|pounds|pound|lbs|lb|reps|rep)\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      const rpeMatch = body.match(/\b(?:rpe|r p e)\s*(\d+(?:\.\d+)?)\b/);
      const rpe = rpeMatch ? rpeMatch[1] : "";
      if (rpeMatch) body = body.replace(rpeMatch[0], " ");
      const notesMatch = body.match(/\bnote\s+(.+)$/);
      const notes = notesMatch ? notesMatch[1].trim() : "";
      if (notesMatch) body = body.replace(notesMatch[0], " ");
      const sets = [];
      const pairPattern = /(\d+(?:\.\d+)?)\s*(?:x|by|for|with)\s*(\d{1,3})/g;
      let match;
      while ((match = pairPattern.exec(body))) sets.push({ weight_lb: match[1], reps: match[2], rpe, notes });
      if (sets.length) return sets;
      const numbers = body.match(/\d+(?:\.\d+)?/g) || [];
      for (let index = 0; index < numbers.length - 1; index += 2) sets.push({ weight_lb: numbers[index], reps: numbers[index + 1], rpe, notes });
      return sets;
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast("Voice entry is not available in this browser.");
        return;
      }
      if (listening && recognition) {
        recognition.stop();
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      listening = true;
      render();
      recognition.onresult = (event) => {
        let transcript = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) transcript += event.results[index][0].transcript;
        state.command = transcript.trim();
        const input = document.getElementById("commandInput");
        if (input) input.value = state.command;
        const latest = event.results[event.results.length - 1];
        if (latest?.isFinal) showToast(parseCommand(state.command).message);
      };
      recognition.onerror = (event) => {
        listening = false;
        render();
        showToast(event.error === "not-allowed" ? "Microphone permission was blocked." : `Voice error: ${event.error}`);
      };
      recognition.onend = () => {
        listening = false;
        render();
      };
      try {
        recognition.start();
      } catch {
        listening = false;
        render();
      }
    }

    function voiceStatusText() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return "Voice unavailable in this browser.";

    }

    function startRestTimer(seconds) {
      const now = Date.now();
      state.rest = { duration: seconds, remaining: seconds, startedAt: now, pausedAt: null, totalPaused: 0, running: true, done: false };
      tickRest();
      if (restInterval) clearInterval(restInterval);
      restInterval = setInterval(tickRest, 250);
    }

    function tickRest() {
      if (!state.rest) return;
      if (state.rest.running) {
        const elapsed = Math.floor((Date.now() - state.rest.startedAt - state.rest.totalPaused) / 1000);
        state.rest.remaining = Math.max(0, state.rest.duration - elapsed);
      }
      if (state.rest.remaining <= 0 && !state.rest.done) {
        state.rest.done = true;
        notifyRestDone();
      }
      renderRestBar();
    }

    function renderRestBar() {
      const bar = document.getElementById("restBar");
      if (!bar || !state.rest) {
        if (bar) bar.classList.remove("show");
        return;
      }
      bar.classList.add("show");
      bar.innerHTML = `
        <div class="rest-inner">
          <div><b>Rest</b> <span class="rest-time">${formatTimer(state.rest.remaining)}</span></div>
          <button class="mini-btn" type="button" data-rest-adjust="-15">-15</button>
          <button class="mini-btn primary" type="button" data-rest-toggle><span data-icon="${state.rest.running ? "pause" : "play"}"></span></button>
          <button class="mini-btn" type="button" data-rest-adjust="15">+15</button>
          <button class="ghost-btn" type="button" data-rest-skip>Skip</button>
        </div>
      `;
      renderIcons(bar);
    }

    function sessionElapsedMs(session) {
      ensureSessionFields(session);
      const start = Number(session.timer_started_at);
      const end = session.finished_at ? new Date(session.finished_at).getTime() : (session.timer_paused_at || Date.now());
      return Math.max(0, end - start - Number(session.paused_total_ms || 0));
    }

    function toggleSessionTimer() {
      const session = activeSession();
      const now = Date.now();
      if (session.finished_at) session.finished_at = null;
      if (session.timer_paused_at) {
        session.paused_total_ms += now - session.timer_paused_at;
        session.timer_paused_at = null;
      } else {
        session.timer_paused_at = now;
      }
      session.updated_at = new Date().toISOString();
      render();
    }

    function finishSession() {
      const session = activeSession();
      if (session.finished_at) {
        session.finished_at = null;
        if (!session.timer_paused_at) session.timer_started_at = Date.now() - sessionElapsedMs(session);
      } else {
        session.finished_at = new Date().toISOString();
        session.timer_paused_at = null;
      }
      session.updated_at = new Date().toISOString();
      render();
    }

    function setSessionDuration(ms) {
      const session = activeSession();
      const desired = Math.max(0, Number(ms || 0));
      const end = session.finished_at ? new Date(session.finished_at).getTime() : (session.timer_paused_at || Date.now());
      session.timer_started_at = end - Number(session.paused_total_ms || 0) - desired;
      session.updated_at = new Date().toISOString();
      render();
    }

    function setSessionDurationFromInput() {
      const input = document.getElementById("sessionTimeInput");
      const ms = parseDurationInput(input?.value);
      if (!Number.isFinite(ms)) {
        showToast("Use time like 75m, 1:15, or 1:15:00.");
        return;
      }
      setSessionDuration(ms);
      showToast("Session time updated.");
    }

    function adjustSessionDuration(deltaMs) {
      const session = activeSession();
      setSessionDuration(sessionElapsedMs(session) + Number(deltaMs || 0));
    }

    function exerciseTiming(logs, session) {
      if (!logs.length) return { elapsedMs: 0, avgRestMs: 0, label: "not started" };
      const times = logs.map((set) => new Date(set.created_at || set.updated_at).getTime()).filter(Number.isFinite).sort((a, b) => a - b);
      const first = times[0];
      const last = times.length > 1 ? times[times.length - 1] : (session.finished_at ? new Date(session.finished_at).getTime() : Date.now());
      const gaps = times.slice(1).map((time, index) => time - times[index]).filter((gap) => gap > 0);
      const avgRestMs = gaps.length ? gaps.reduce((sum, gap) => sum + gap, 0) / gaps.length : 0;
      return {
        elapsedMs: Math.max(0, last - first),
        avgRestMs,
        label: `${formatDuration(Math.max(0, last - first))} work${avgRestMs ? ` / ${formatDuration(avgRestMs)} avg rest` : ""}`
      };
    }

    function updateLiveTimers() {
      document.querySelectorAll("[data-session-timer]").forEach((node) => {
        const session = state.sessions.find((item) => item.id === node.dataset.sessionTimer);
        if (session) node.textContent = formatDuration(sessionElapsedMs(session));
      });
      document.querySelectorAll("[data-exercise-time]").forEach((node) => {
        const [sessionId, exerciseId] = node.dataset.exerciseTime.split("|");
        const session = state.sessions.find((item) => item.id === sessionId);
        if (!session) return;
        node.textContent = exerciseTiming(setsForExercise(exerciseId, sessionId), session).label;
      });
    }

    function notifyRestDone() {
      if (!state.settings.muted) {
        if (navigator.vibrate) navigator.vibrate(300);
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.frequency.value = 660;
          gain.gain.value = 0.045;
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start();
          setTimeout(() => {
            oscillator.stop();
            ctx.close();
          }, 180);
        } catch {
          // Audio is optional.
        }
      }
      showToast("Rest done.");

    function toCSV(sets) {
      const headers = ["date", "exercise", "set_number", "reps", "weight_lb", "rpe", "notes"];
      const rows = sets.slice().sort(sortRecords).map((set) => [set.date, set.exercise, set.set_number, set.reps, set.weight_lb, set.rpe, set.notes]);
      return [headers, ...rows].map((row) => row.map(csvCell).join(",")).join("\n");
    }

    function csvCell(value) {
      return String(value ?? "").replace(/[\r\n,]/g, " ").trim();
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim());
      const headers = lines.shift()?.split(",").map((item) => item.trim()) || [];
      const expected = ["date", "exercise", "set_number", "reps", "weight_lb", "rpe", "notes"];
      if (expected.some((item, index) => headers[index] !== item)) throw new Error("CSV headers must be date,exercise,set_number,reps,weight_lb,rpe,notes");
      return lines.map((line, index) => {
        const cells = line.split(",");
        const record = Object.fromEntries(expected.map((key, keyIndex) => [key, (cells[keyIndex] || "").trim()]));
        return validateCSVRecord(record, index + 2);
      });
    }

    function validateCSVRecord(record, row) {
      const errors = [];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(record.date)) errors.push("bad ISO date");
      if (!record.exercise) errors.push("missing exercise");
      if (!Number(record.set_number)) errors.push("bad set_number");
      if (!Number(record.reps)) errors.push("bad reps");
      if (!Number(record.weight_lb)) errors.push("bad weight_lb");
      return { row, record: { ...record, set_number: Number(record.set_number), reps: Number(record.reps), weight_lb: Number(record.weight_lb) }, errors };
    }

    function previewCSV(text) {
      const rows = parseCSV(text).map((item) => {
        if (item.errors.length) return { row: item.row, record: item.record, status: "errored", message: item.errors.join("; ") };
        const exercise = ensureExerciseByName(item.record.exercise);
        const id = csvRecordId(item.record);
        const existing = state.sets.find((set) => csvRecordId(set) === id);
        const status = existing ? (existing.reps === item.record.reps && existing.weight_lb === item.record.weight_lb && String(existing.rpe || "") === String(item.record.rpe || "") && String(existing.notes || "") === String(item.record.notes || "") ? "unchanged" : "changed") : "added";
        return { row: item.row, record: { ...item.record, exercise_id: exercise.id }, status, message: "" };
      });
      state.csvPreview = {
        rows,
        added: rows.filter((row) => row.status === "added").length,
        changed: rows.filter((row) => row.status === "changed").length,
        unchanged: rows.filter((row) => row.status === "unchanged").length,
        errored: rows.filter((row) => row.status === "errored").length
      };
      render();
    }

    function commitCSVImport() {
      if (!state.csvPreview || state.csvPreview.errored) return;
      state.csvPreview.rows.filter((row) => row.status !== "unchanged").forEach((row) => {
        const record = row.record;
        const session = getOrCreateImportedSession(record.date);
        const id = csvRecordId(record);
        const existing = state.sets.findIndex((set) => csvRecordId(set) === id);
        const payload = {
          id: existing >= 0 ? state.sets[existing].id : cryptoId(),
          session_id: session.id,
          date: record.date,
          exercise_id: record.exercise_id,
          exercise: record.exercise,
          set_number: Number(record.set_number),
          reps: Number(record.reps),
          weight_lb: Number(record.weight_lb),
          rpe: record.rpe,
          notes: record.notes,
          created_at: existing >= 0 ? state.sets[existing].created_at : new Date().toISOString(),
          updated_at: new Date().toISOString()
        };
        if (existing >= 0) state.sets[existing] = payload;
        else state.sets.push(payload);
      });
      state.csvPreview = null;
      render();
      showToast("CSV import committed.");
    }

    function getOrCreateImportedSession(date) {
      let session = state.sessions.find((item) => item.date === date && item.day_id === state.activeDayId);
      if (!session) {
        session = { id: cryptoId(), date, program_id: state.activeProgramId, day_id: state.activeDayId, started_at: new Date().toISOString(), updated_at: new Date().toISOString() };
        state.sessions.push(session);
      }
      return session;
    }

    function backupPayload() {
      return JSON.stringify({ app: "Workout Log", version: 2, exported_at: new Date().toISOString(), state: { ...state, command: "", csvPreview: null } }, null, 2);
    }

    async function importJSON(file) {
      const parsed = JSON.parse(await file.text());
      state = normalizeState(parsed.state || parsed);
      render();
      showToast("JSON import complete.");
    }

    async function syncGist(mode) {
      const sync = state.settings.sync;
      const token = cleanValue(document.getElementById("gistToken")?.value || sync.token);
      sync.gistId = cleanValue(document.getElementById("gistId")?.value || sync.gistId);
      sync.fileName = cleanValue(document.getElementById("gistFile")?.value || sync.fileName || GIST_FILE);
      sync.rememberToken = document.getElementById("rememberToken")?.value === "true";
      sync.token = sync.rememberToken ? token : "";
      if (!sync.gistId || !token) {
        showToast("Gist ID and PAT are required.");
        return;
      }
      if (mode === "pull" || mode === "sync") await pullGist(sync.gistId, token, sync.fileName);
      if (mode === "push" || mode === "sync") await pushGist(sync.gistId, token, sync.fileName);
      sync.lastSyncAt = new Date().toISOString();
      render();
    }

    async function pullGist(gistId, token, fileName) {
      const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
      if (!response.ok) throw new Error("Gist pull failed");
      const gist = await response.json();
      const content = gist.files?.[fileName]?.content;
      if (!content) return;
      state = mergeStates(state, normalizeState(JSON.parse(content).state || JSON.parse(content)));
    }

    async function pushGist(gistId, token, fileName) {
      const response = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: "PATCH",
        headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify({ files: { [fileName]: { content: backupPayload() } } })
      });
      if (!response.ok) throw new Error("Gist push failed");
    }

    function mergeStates(local, remote) {
      return normalizeState({
        ...local,
        exercises: mergeByUpdatedAt(local.exercises, remote.exercises),
        programs: mergeByUpdatedAt(local.programs, remote.programs),
        sessions: mergeByUpdatedAt(local.sessions, remote.sessions),
        sets: mergeByUpdatedAt(local.sets, remote.sets),
        profile: remote.profile || local.profile,
        settings: { ...local.settings, sync: local.settings.sync }
      });
    }

    function buildStrengthStandards() {
      const ageMultipliers = { "18-39": 1, "40-49": 0.92, "50-59": 0.82, "60-69": 0.7 };
      return Object.entries(strengthStandardModels).flatMap(([liftId, model]) =>
        ["male", "female"].flatMap((sex) =>
          bodyweightBrackets.flatMap((bodyweight) =>
            ageBrackets.flatMap((age) =>
              standardLevels.map((level, index) => ({
                lift_id: liftId,
                lift: model.lift,
                sex,
                bodyweight_bracket_lb: bodyweight,
                age_bracket: age,
                level,
                one_rm_lb: Math.round(bodyweight * model[sex][index] * ageMultipliers[age] / 5) * 5
              }))
            )
          )
        )
      );
    }

    function renderStandardsList() {
      const sex = state.profile.sex || "male";
      const bodyweight = Number(state.profile.bodyweight_lb) || 180;
      const age = Number(state.profile.age) || 30;
      const bracket = nearest(bodyweightBrackets, bodyweight);
      const ageBracket = ageToBracket(age);
      return Object.entries(strengthStandardModels).map(([liftId, model]) => {
        const standards = strengthStandards.filter((row) =>
          row.lift_id === liftId &&
          row.sex === sex &&
          row.bodyweight_bracket_lb === bracket &&
          row.age_bracket === ageBracket
        );
        const best = bestE1RMForModel(model);
        const elite = standards.find((row) => row.level === "elite")?.one_rm_lb || 1;
        const position = Math.min(100, Math.max(0, best ? (best / elite) * 100 : 0));
        const level = best ? currentStandardLevel(best, standards) : "no data";
        return `
          <article class="standard-card panel">
            <div class="row-between">
              <div>
                <b>${escapeHtml(model.lift)}</b>
                <div class="muted">${sex} / ${bracket} lb / age ${ageBracket}</div>
              </div>
              <div class="row-main" style="text-align:right">
                <b>${best ? `${Math.round(best)} lb` : "--"}</b>
                <span>${escapeHtml(level)}</span>
              </div>
            </div>
            <div class="standard-bar" aria-label="${escapeHtml(model.lift)} standards">
              <span class="standard-marker" style="left: calc(${position}% - 2px)"></span>
            </div>
            <div class="standard-levels">
              ${standards.map((row) => `<span>${row.level}<br>${row.one_rm_lb}</span>`).join("")}
            </div>
          </article>
        `;
      }).join("");
    }

    function bestE1RMForModel(model) {
      const ids = new Set(model.aliases);
      return state.sets
        .filter((set) => ids.has(set.exercise_id) || model.aliases.some((alias) => normalizeText(set.exercise).includes(normalizeText(alias))))
        .reduce((best, set) => Math.max(best, Number(set.weight_lb || 0) * (1 + Number(set.reps || 0) / 30)), 0);
    }

    function currentStandardLevel(best, standards) {
      let level = "below untrained";
      standards.forEach((row) => {
        if (best >= row.one_rm_lb) level = row.level;
      });
      return level;
    }

    function ageToBracket(age) {
      if (age >= 60) return "60-69";
      if (age >= 50) return "50-59";
      if (age >= 40) return "40-49";
      return "18-39";
    }

    function nearest(values, target) {
      return values.reduce((best, value) => Math.abs(value - target) < Math.abs(best - target) ? value : best, values[0]);
    }

    function drawCharts() {
      document.querySelectorAll("[data-pr-chart]").forEach((canvas) => drawPRChart(canvas, canvas.dataset.prChart));
      const elapsed = performance.now() - chartStart;
      if (elapsed > 200) console.info(`PR charts rendered in ${Math.round(elapsed)}ms`);
    }

    function drawPRChart(canvas, exerciseId) {
      const ctx = canvas.getContext("2d");
      const points = topSetsByDate(exerciseId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#2c3340";
      ctx.lineWidth = 1;
      for (let y = 24; y < canvas.height - 20; y += 40) {
        ctx.beginPath();
        ctx.moveTo(34, y);
        ctx.lineTo(canvas.width - 12, y);
        ctx.stroke();
      }
      if (!points.length) {
        ctx.fillStyle = "#a1acb8";
        ctx.fillText("No top sets yet", 34, 80);
        return;
      }
      const minTime = Math.min(...points.map((point) => point.time));
      const maxTime = Math.max(...points.map((point) => point.time));
      const minY = Math.min(...points.map((point) => point.e1rm)) * 0.95;
      const maxY = Math.max(...points.map((point) => point.e1rm)) * 1.05;
      let best = 0;
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = scale(point.time, minTime, maxTime, 38, canvas.width - 18);
        const y = scale(point.e1rm, minY, maxY, canvas.height - 24, 18);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "#8fb7ff";
      ctx.lineWidth = 3;
      ctx.stroke();
      points.forEach((point) => {
        const x = scale(point.time, minTime, maxTime, 38, canvas.width - 18);
        const y = scale(point.e1rm, minY, maxY, canvas.height - 24, 18);
        const pr = point.e1rm > best;
        best = Math.max(best, point.e1rm);
        ctx.fillStyle = pr ? "#6ee7b7" : "#f4f7fb";
        ctx.beginPath();
        ctx.arc(x, y, pr ? 5 : 3, 0, Math.PI * 2);
        ctx.fill();
        if (pr) {
          ctx.fillStyle = "#6ee7b7";
          ctx.font = "12px system-ui";
          ctx.fillText(`${Math.round(point.e1rm)}`, x + 6, y - 6);
        }
      });
    }

    function topSetsByDate(exerciseId) {
      const groups = new Map();
      setsForExercise(exerciseId).forEach((set) => {
        const e1rm = Number(set.weight_lb) * (1 + Number(set.reps) / 30);
        const previous = groups.get(set.date);
        if (!previous || e1rm > previous.e1rm) groups.set(set.date, { date: set.date, time: new Date(`${set.date}T12:00:00`).getTime(), e1rm });
      });
      return [...groups.values()].sort((a, b) => a.time - b.time);
    }

    function mostLoggedExercises() {
      return state.exercises.slice().sort((a, b) => setsForExercise(b.id).length - setsForExercise(a.id).length).filter((exercise) => setsForExercise(exercise.id).length);
    }

    function filterExercises(query = "", muscle = "", pattern = "") {
      const q = normalizeText(query);
      return state.exercises.filter((exercise) => {
        const search = normalizeText([exercise.name, exercise.primary_muscle, exercise.movement_pattern, ...(exercise.aliases || [])].join(" "));
        return (!q || search.includes(q)) && (!muscle || exercise.primary_muscle === muscle || exercise.secondary_muscles.includes(muscle)) && (!pattern || exercise.movement_pattern === pattern);
      }).sort(byName);
    }

    function ensureExerciseByName(name) {
      let exercise = state.exercises.find((item) => normalizeText(item.name) === normalizeText(name));
      if (!exercise) {
        exercise = ex(slug(name), name, "Custom", [], "press", 120, 3, "8-12");
        exercise.updated_at = new Date().toISOString();
        state.exercises.push(exercise);
      }
      return exercise;
    }

    function showModal(content) {
      const modal = document.getElementById("modal");
      modal.innerHTML = `<div class="modal-panel">${content}</div>`;
      modal.classList.add("show");
      renderIcons(modal);
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      modal.classList.remove("show");
      modal.innerHTML = "";
    }

    function showToast(message, undo = null) {
      const toast = document.getElementById("toast");
      toast.innerHTML = `${escapeHtml(message)}${undo ? '<button type="button" id="undoToast">Undo</button>' : ""}`;
      toast.classList.add("show");
      if (undo) toast.querySelector("#undoToast").onclick = () => {
        undo();
        toast.classList.remove("show");
      };
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), undo ? 10000 : 2200);
    }

    document.addEventListener("click", async (event) => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.dataset.view;
        render();
        return;
      }
      const dayButton = event.target.closest("[data-day]");
      if (dayButton) {
        state.activeDayId = dayButton.dataset.day;
        render();
        return;
      }
      if (event.target.closest("#editPlanBtn")) {
        state.editPlan = !state.editPlan;
        state.view = "plan";
        render();
        return;
      }
      if (event.target.closest("#todayBtn")) {
        state.activeDate = todayISO();
        render();
        return;
      }
      if (event.target.closest("#sessionToggleBtn")) return toggleSessionTimer();
      if (event.target.closest("#sessionFinishBtn")) return finishSession();
      if (event.target.closest("#sessionSetTimeBtn")) return setSessionDurationFromInput();
      const sessionAdjust = event.target.closest("[data-session-adjust]");
      if (sessionAdjust) return adjustSessionDuration(Number(sessionAdjust.dataset.sessionAdjust));
      if (event.target.closest("#voiceBtn")) return startVoice();
      if (event.target.closest("#parseBtn")) {
        const result = parseCommand(state.command || document.getElementById("commandInput").value);
        showToast(result.message);
        render();
        return;
      }
      const addSetButton = event.target.closest("[data-add-set]");
      if (addSetButton) {
        if (!addSet(addSetButton.dataset.addSet)) showToast("Weight and reps are needed.");
        return;
      }
      const deleteSetButton = event.target.closest("[data-delete-set]");
      if (deleteSetButton) return deleteSet(deleteSetButton.dataset.deleteSet);
      const addExerciseButton = event.target.closest("[data-add-exercise-day]");
      if (addExerciseButton) return openExercisePicker(addExerciseButton.dataset.addExerciseDay);
      const swapButton = event.target.closest("[data-swap-block]");
      if (swapButton) {
        const found = findBlock(swapButton.dataset.swapBlock);
        return openExercisePicker(found?.day.id, swapButton.dataset.swapBlock);
      }
      const pickButton = event.target.closest("[data-pick-exercise]");
      if (pickButton) return pickExercise(pickButton.dataset.pickExercise);
      if (event.target.closest("#createFromPickerBtn")) return openExerciseForm();
      if (event.target.closest("[data-close-modal]") || event.target.id === "modal") return closeModal();
      if (event.target.closest("#newExerciseBtn")) return openExerciseForm();
      const editExerciseButton = event.target.closest("[data-edit-exercise]");
      if (editExerciseButton) return openExerciseForm(editExerciseButton.dataset.editExercise);
      const duplicateExerciseButton = event.target.closest("[data-duplicate-exercise]");
      if (duplicateExerciseButton) return openExerciseForm(duplicateExerciseButton.dataset.duplicateExercise, true);
      const deleteExerciseButton = event.target.closest("[data-delete-exercise]");
      if (deleteExerciseButton) return deleteExercise(deleteExerciseButton.dataset.deleteExercise);
      if (event.target.closest("#saveExerciseBtn")) return saveExerciseForm();
      const editBlockButton = event.target.closest("[data-edit-block]");
      if (editBlockButton) return openBlockEditor(editBlockButton.dataset.editBlock);
      if (event.target.closest("#saveBlockBtn")) return saveBlockEditor();
      if (event.target.closest("#newPlanBtn")) return openNewPlanWizard();
      if (event.target.closest("#createPlanBtn")) return createPlanFromWizard();
      const restAdjust = event.target.closest("[data-rest-adjust]");
      if (restAdjust) return adjustRest(Number(restAdjust.dataset.restAdjust));
      if (event.target.closest("[data-rest-toggle]")) return toggleRest();
      if (event.target.closest("[data-rest-skip]")) return skipRest();
      if (event.target.closest("#downloadCsvBtn")) return downloadText(toCSV(state.sets), `workout-log-sets-${todayISO()}.csv`, "text/csv");
      if (event.target.closest("#copyCsvBtn")) return copyText(toCSV(state.sets));
      if (event.target.closest("#importCsvBtn")) return document.getElementById("csvFile").click();
      if (event.target.closest("#downloadJsonBtn")) return downloadText(backupPayload(), `workout-log-backup-${todayISO()}.json`, "application/json");
      if (event.target.closest("#importJsonBtn")) return document.getElementById("jsonFile").click();
      if (event.target.closest("#commitCsvBtn")) return commitCSVImport();
      if (event.target.closest("#cancelCsvBtn")) {
        state.csvPreview = null;
        render();
        return;
      }
      if (event.target.closest("#syncNowBtn")) return syncGist("sync").catch((error) => showToast(error.message));
      if (event.target.closest("#pullGistBtn")) return syncGist("pull").catch((error) => showToast(error.message));
      if (event.target.closest("#pushGistBtn")) return syncGist("push").catch((error) => showToast(error.message));
    });

    document.addEventListener("input", (event) => {
      const draftInput = event.target.closest("[data-draft]");
      if (draftInput) {
        const id = draftInput.dataset.draft;
        state.drafts[id] ||= {};
        state.drafts[id][draftInput.dataset.field] = draftInput.value;
        saveState();
        return;
      }
      if (event.target.id === "commandInput") {
        state.command = event.target.value;
        saveState();
        return;
      }
      if (event.target.dataset.sessionNotes) {
        const session = state.sessions.find((item) => item.id === event.target.dataset.sessionNotes);
        if (session) {
          session.notes = event.target.value;
          session.updated_at = new Date().toISOString();
          saveState();
        }
        return;
      }
      if (event.target.dataset.profileField) {
        state.profile[event.target.dataset.profileField] = event.target.value;
        saveState();
        if (state.view === "progress") renderProgressView();
        return;
      }
      if (event.target.id === "exerciseSearch") state.exerciseQuery = event.target.value;
      if (event.target.id === "exerciseMuscle") state.exerciseMuscle = event.target.value;
      if (event.target.id === "exercisePattern") state.exercisePattern = event.target.value;
      if (["exerciseSearch", "exerciseMuscle", "exercisePattern"].includes(event.target.id)) renderExercisesView();
      if (event.target.id === "pickerQuery") {
        state.picker.query = event.target.value;
        renderPickerModal();
      }
    });

    document.addEventListener("change", async (event) => {
      if (event.target.dataset.profileField) {
        state.profile[event.target.dataset.profileField] = event.target.value;
        saveState();
        if (state.view === "progress") renderProgressView();
        return;
      }
      if (event.target.id === "workoutDate") {
        state.activeDate = event.target.value || todayISO();
        render();
      }
      if (event.target.id === "programSelect") {
        state.activeProgramId = event.target.value;
        state.activeDayId = getProgram()?.days[0]?.id;
        render();
      }
      if (event.target.id === "progressExercise") {
        state.progressExerciseId = event.target.value;
        render();
      }
      if (event.target.dataset.dayType) {
        const day = getProgram().days.find((item) => item.id === event.target.dataset.dayType);
        day.type = event.target.value;
        if (day.type === "Rest" && day.blocks.length && window.confirm("Setting this day to Rest clears its blocks. Continue?")) day.blocks = [];
        render();
      }
      if (event.target.id === "pickerMuscle") {
        state.picker.muscle = event.target.value;
        renderPickerModal();
      }
      if (event.target.id === "pickerPattern") {
        state.picker.pattern = event.target.value;
        renderPickerModal();
      }
      if (event.target.id === "csvFile" && event.target.files?.[0]) {
        try {
          previewCSV(await event.target.files[0].text());
        } catch (error) {
          showToast(error.message);
        }
        event.target.value = "";
      }
      if (event.target.id === "jsonFile" && event.target.files?.[0]) {
        try {
          await importJSON(event.target.files[0]);
        } catch {
          showToast("JSON import failed.");
        }
        event.target.value = "";
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      if (event.target.id === "sessionTimeInput") {
        event.preventDefault();
        setSessionDurationFromInput();
        return;
      }
      const form = event.target.closest("[data-block-form]");
      if (!form) return;
      event.preventDefault();
      if (!addSet(form.dataset.blockForm)) showToast("Weight and reps are needed.");
    });

    document.addEventListener("dragstart", (event) => {
      const dayCard = event.target.closest("[data-day-card]");
      const blockRow = event.target.closest("[data-block-row]");
      if (dayCard) dragData = { type: "day", id: dayCard.dataset.dayCard };
      if (blockRow) dragData = { type: "block", id: blockRow.dataset.blockRow, dayId: blockRow.dataset.dayId };
    });

    document.addEventListener("dragover", (event) => {
      if (event.target.closest("[data-day-card], [data-block-row]")) event.preventDefault();
    });

    document.addEventListener("drop", (event) => {
      event.preventDefault();
      if (!dragData) return;
      const targetDay = event.target.closest("[data-day-card]");
      const targetBlock = event.target.closest("[data-block-row]");
      if (dragData.type === "day" && targetDay) reorderItems(getProgram().days, dragData.id, targetDay.dataset.dayCard);
      if (dragData.type === "block" && targetBlock) {
        const day = getProgram().days.find((item) => item.id === dragData.dayId);
        reorderItems(day.blocks, dragData.id, targetBlock.dataset.blockRow);
      }
      dragData = null;
      render();
    });

    window.addEventListener("online", () => {
      if (state.settings.sync.gistId && state.settings.sync.token) syncGist("sync").catch(() => {});
    });

    function downloadText(text, name, type) {
      const blob = new Blob([text], { type: `${type};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = name;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        showToast("Copied.");
      }
    }

    function mergeById(base, incoming) {
      return [...new Map([...base, ...incoming].map((item) => [item.id, item])).values()];
    }

    function mergeByUpdatedAt(local = [], remote = []) {
      const map = new Map();
      [...local, ...remote].forEach((item) => {
        const previous = map.get(item.id);
        if (!previous || String(item.updated_at || "") >= String(previous.updated_at || "")) map.set(item.id, item);
      });
      return [...map.values()];
    }

    function findBlock(blockId) {
      for (const day of getProgram().days) {
        const block = day.blocks.find((item) => item.id === blockId);
        if (block) return { day, block };
      }
      return null;
    }

    function reorderItems(items, sourceId, targetId) {
      const sourceIndex = items.findIndex((item) => item.id === sourceId);
      const targetIndex = items.findIndex((item) => item.id === targetId);
      if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return;
      const [moved] = items.splice(sourceIndex, 1);
      items.splice(targetIndex, 0, moved);
      items.forEach((item, index) => {
        item.order = index;
        item.updated_at = new Date().toISOString();
      });
    }

    function csvRecordId(record) {
      return `${record.date}|${normalizeText(record.exercise)}|${record.set_number}`;
    }

    function normalizeText(text) {
      return replaceNumberWords(String(text).toLowerCase())
        .replace(/dumbbells?/g, "db")
        .replace(/triceps/g, "tricep")
        .replace(/r\.?p\.?e\.?/g, "rpe")
        .replace(/times/g, "x")
        .replace(/[^a-z0-9.\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function replaceNumberWords(text) {
      const numbers = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20 };
      return text.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty)\b/g, (word) => numbers[word]);
    }

    function slug(text) {
      return normalizeText(text).replace(/\s+/g, "-") || cryptoId();
    }

    function splitList(text) {
      return String(text || "").split(",").map((item) => item.trim()).filter(Boolean);
    }

    function parseWeight(value) {
      return Number.parseFloat(String(value).replace(/[^0-9.]/g, ""));
    }

    function formatWeight(value) {
      return Number.isFinite(Number(value)) ? `${value} lb` : String(value || "");
    }

    function volume(set) {
      return Number(set.weight_lb || 0) * Number(set.reps || 0);
    }

    function scale(value, min, max, outMin, outMax) {
      if (min === max) return (outMin + outMax) / 2;
      return outMin + ((value - min) / (max - min)) * (outMax - outMin);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value || 0);
    }

    function formatTimer(seconds) {
      const safe = Math.max(0, Number(seconds || 0));
      const min = Math.floor(safe / 60);
      const sec = Math.floor(safe % 60);
      return `${min}:${String(sec).padStart(2, "0")}`;
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(Number(ms || 0) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours) return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function parseDurationInput(value) {
      const text = cleanValue(value).toLowerCase();
      if (!text) return NaN;
      if (/^\d+(\.\d+)?$/.test(text)) return Number(text) * 60000;
      const colon = text.match(/^(\d+):([0-5]?\d)(?::([0-5]?\d))?$/);
      if (colon) {
        const first = Number(colon[1]);
        const second = Number(colon[2]);
        const third = Number(colon[3] || 0);
        return colon[3] ? ((first * 3600) + (second * 60) + third) * 1000 : ((first * 60) + second) * 1000;
      }
      const hours = text.match(/(\d+(?:\.\d+)?)\s*h/);
      const minutes = text.match(/(\d+(?:\.\d+)?)\s*m/);
      const seconds = text.match(/(\d+(?:\.\d+)?)\s*s/);
      const total =
        (hours ? Number(hours[1]) * 3600000 : 0) +
        (minutes ? Number(minutes[1]) * 60000 : 0) +
        (seconds ? Number(seconds[1]) * 1000 : 0);
      return total || NaN;
    }

    function shortDayLabel(index, label) {
      return label.split(" ")[0].slice(0, 3) || `D${index + 1}`;
    }

    function cleanValue(value) {
      return String(value ?? "").trim();
    }

    function cryptoId() {
      if (window.crypto?.randomUUID) return crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function sortRecords(a, b) {
      return `${a.date || ""}-${a.created_at || ""}`.localeCompare(`${b.date || ""}-${b.created_at || ""}`);
    }

    function byOrder(a, b) {
      return Number(a.order || 0) - Number(b.order || 0);
    }

    function byName(a, b) {
      return a.name.localeCompare(b.name);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function initApp() {
      try {
        state = await loadState();
      } catch {
        state = createDefaultState();
      }
      if (state.rest?.running) {
        restInterval = setInterval(tickRest, 250);
      }
      if (!uiClock) uiClock = setInterval(updateLiveTimers, 1000);
      render();
      registerServiceWorker();
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    initApp();
  </script>
</body>
</html>
