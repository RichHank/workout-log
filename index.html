      const filtered = useMemo(() =>
        state.exercises.filter((e) =>
          (!query || normalizeText(e.name).includes(normalizeText(query)))
          && (!muscle || e.primary_muscle === muscle)
          && (!pattern || e.movement_pattern === pattern)
        ).sort(byName),
        [state.exercises, query, muscle, pattern]
      );
      return h("section", null,
        h("div", { class: "actions" },
          h("button", { class: "primary-btn", type: "button",
            onClick: () => openModal(h(ExerciseFormModal, { onClose: () => openModal(null), updateState }))
          }, "New Exercise"),
          h("input", { placeholder: "Search exercises", value: query,
            onInput: (e) => updateState((d) => { d.exerciseQuery = e.currentTarget.value; }, { localOnly: true })
          }),
          h("select", {
            value: muscle,
            onChange: (e) => updateState((d) => { d.exerciseMuscle = e.currentTarget.value; }, { localOnly: true })
          }, h("option", { value: "" }, "All muscles"),
            muscles.map((item) => h("option", { key: item, value: item }, item))),
          h("select", {
            value: pattern,
            onChange: (e) => updateState((d) => { d.exercisePattern = e.currentTarget.value; }, { localOnly: true })
          }, h("option", { value: "" }, "All patterns"),
            patterns.map((item) => h("option", { key: item, value: item }, item)))
        ),
        h("section", { class: "panel exercise-list" },
          filtered.length
            ? filtered.map((exercise) => h("div", { key: exercise.id, class: "exercise-row" },
                h("div", { class: "row-main" },
                  h("b", null, exercise.name),
                  h("span", null, `${exercise.primary_muscle} / ${exercise.movement_pattern} / ${exercise.default_sets} x ${exercise.default_rep_range} / ${formatRest(exercise.default_rest_seconds)}`)
                ),
                h("div", { class: "row-actions", style: "grid-auto-flow:column" },
                  h("button", { class: "mini-btn", type: "button",
                    onClick: () => openModal(h(ExerciseFormModal, { exercise, updateState, onClose: () => openModal(null) }))
                  }, "Edit"),
                  h("button", { class: "mini-btn danger", type: "button",
                    onClick: () => deleteExercise(exercise.id, updateState, showToast)
                  }, "Del")
                )
              ))
            : h("div", { class: "empty" }, "No exercises found.")
        )
      );
    }

    function ExerciseFormModal({ exercise, updateState, onClose }) {
      const [form, setForm] = useState(exercise || createExercise({ name: "" }));
      const set = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));
      return h(Modal, { title: exercise ? "Edit Exercise" : "New Exercise", onClose },
        h("div", { class: "stack" },
          h("div", { class: "form-grid" },
            h(FieldInput, { label: "Name", value: form.name, onInput: (v) => set("name", v) }),
            h(FieldSelect, { label: "Muscle", value: form.primary_muscle || "Chest", options: muscles,
              onChange: (v) => set("primary_muscle", v) }),
            h(FieldSelect, { label: "Pattern", value: form.movement_pattern || "press", options: patterns,
              onChange: (v) => set("movement_pattern", v) }),
            h(FieldInput, { label: "Default sets", value: form.default_sets, inputMode: "numeric",
              onInput: (v) => set("default_sets", v) }),
            h(FieldInput, { label: "Default reps", value: form.default_rep_range,
              onInput: (v) => set("default_rep_range", v) }),
            h(FieldInput, { label: "Default rest (sec)", value: form.default_rest_seconds, inputMode: "numeric",
              onInput: (v) => set("default_rest_seconds", v) }),
            h(FieldInput, { label: "Aliases (comma)", value: (form.aliases || []).join(", "),
              onInput: (v) => set("aliases", v.split(",").map((s) => s.trim()).filter(Boolean)) })
          ),
          h("button", { class: "primary-btn", type: "button",
            onClick: () => {
              const restNum = Number(form.default_rest_seconds);
              const setsNum = Number(form.default_sets);
              const payload = {
                ...form,
                default_rest_seconds: Number.isFinite(restNum) ? restNum : 120,
                default_sets: Number.isFinite(setsNum) ? setsNum : 3,
                updated_at: nowISO()
              };
              updateState((draft) => {
                if (exercise) {
                  const idx = draft.exercises.findIndex((e) => e.id === exercise.id);
                  if (idx >= 0) draft.exercises[idx] = payload;
                } else {
                  draft.exercises.push(payload);
                }
              });
              onClose();
            }
          }, "Save")
        )
      );
    }

    function DriveView({ state, updateState, connect, syncNow, fileJsonRef, fileCsvRef }) {
      const drive = state.settings.drive || defaultDriveSettings();
      const connected = K3V_SyncEngine.isConnected();
      return h("section", { class: "stack" },
        h("article", { class: "drive-card panel", style: "padding:12px" },
          h("div", { class: "section-title", style: "margin-top:0" },
            h("h2", null, "Google Drive Sync"),
            h("span", null, connected ? "Connected" : "Ready")
          ),
          h("p", { class: "muted" }, "K3VSYNC stores one JSON file in this user's hidden Google Drive app-data folder. Deep-union sync keeps local-only and remote-only records instead of deleting them."),
          h("div", { class: "form-grid" },
            h(FieldSelect, { label: "Auto sync", value: drive.autoSync === false ? "off" : "on", options: ["on", "off"],
              onChange: (v) => updateState((d) => { d.settings.drive.autoSync = v !== "off"; })
            }),
            h(FieldInput, { label: "Drive file", value: drive.fileName || DRIVE_STATE_FILE,
              onInput: (v) => updateState((d) => { d.settings.drive.fileName = v || DRIVE_STATE_FILE; })
            })
          ),
          h("div", { class: "actions", style: "margin-top:12px" },
            h("button", { class: "primary-btn", type: "button", onClick: connect },
              connected ? "Reconnect Google" : "Sign in with Google"),
            h("button", { class: "ghost-btn", type: "button", disabled: !connected, onClick: syncNow }, "Sync now")
          ),
          h("p", { class: "muted" }, drive.lastStatus || "Sign in to start cross-device sync."),
          h("p", { class: "muted" }, drive.lastSyncAt ? `Last sync: ${formatDateTime(drive.lastSyncAt)}` : "Not synced yet.")
        ),
        h("article", { class: "drive-card panel", style: "padding:12px" },
          h("div", { class: "section-title", style: "margin-top:0" },
            h("h2", null, "Backup Tools"),
            h("span", null, "No Export tab")
          ),
          h("div", { class: "actions" },
            h("button", { class: "ghost-btn", type: "button",
              onClick: () => downloadText(toCSV(state.sets), `k3vsync-sets-${todayISO()}.csv`, "text/csv")
            }, "CSV"),
            h("button", { class: "ghost-btn", type: "button",
              onClick: () => fileCsvRef.current?.click()
            }, "Import CSV"),
            h("button", { class: "ghost-btn", type: "button",
              onClick: () => downloadText(backupPayload(state), `k3vsync-backup-${todayISO()}.json`, "application/json")
            }, "JSON"),
            h("button", { class: "ghost-btn", type: "button",
              onClick: () => fileJsonRef.current?.click()
            }, "Import JSON")
          ),
          state.csvPreview && h(CsvPreview, { preview: state.csvPreview, updateState })
        )
      );
    }

    function CsvPreview({ preview, updateState }) {
      return h("div", { class: "stack" },
        h("p", { class: "muted" }, `${preview.added} added / ${preview.changed} changed / ${preview.unchanged} unchanged / ${preview.errored} errors`),
        h("button", { class: "primary-btn", type: "button", disabled: preview.errored > 0,
          onClick: () => commitCSVImport(updateState)
        }, "Commit Import")
      );
    }

    render(h(K3V_App), document.getElementById("root"));
  </script>
</body>
</html>
