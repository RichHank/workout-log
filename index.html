<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K3VSYNC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/preact@10.26.9/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10.26.9/hooks/dist/hooks.umd.js"></script>
  <title>K3VSYNC</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #202836;
      --panel-3: #10141b;
      --text: #f5f8fc;
      --muted: #9ca9b8;
      --line: #2c3544;
      --line-strong: #3d4b5d;
      --accent: #8fb7ff;
      --green: #74e6ad;
      --gold: #ffd08a;
      --danger: #ff8a93;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      --radius: 8px;
      --tap: 46px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(143, 183, 255, 0.13), transparent 34rem),
        linear-gradient(180deg, #121620 0%, var(--bg) 58%);
      color: var(--text);
    }

    button, input, textarea, select { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled { cursor: not-allowed; opacity: 0.48; }

    input, textarea, select {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #111722;
      color: var(--text);
      outline: none;
      padding: 10px 12px;
    }

    textarea {
      resize: vertical;
      min-height: 86px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(143, 183, 255, 0.16);
    }

    .app-shell {
      width: min(100%, 1040px);
      min-height: 100vh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 14px calc(108px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0 10px;
      background: rgba(14, 17, 22, 0.92);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent), var(--green));
      color: #08111f;
      font-weight: 950;
      letter-spacing: 0;
      box-shadow: var(--shadow);
    }

    h1, h2, h3, p { margin-top: 0; }

    .brand h1 {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
    }

    .sync-chip {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(23, 28, 36, 0.86);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .sync-chip[data-state="syncing"] {
      color: var(--green);
      border-color: rgba(116, 230, 173, 0.42);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 0 rgba(116, 230, 173, 0.45);
    }

    .sync-chip[data-state="syncing"] .sync-dot {
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(116, 230, 173, 0); }
      100% { box-shadow: 0 0 0 0 rgba(116, 230, 173, 0); }
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin: 6px 0 14px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(5, minmax(82px, 1fr));
      gap: 4px;
      padding: 4px;
      overflow-x: auto;
      border-radius: var(--radius);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .segmented button, .day-strip button {
      min-height: 40px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }

    .segmented button[aria-selected="true"], .day-strip button[aria-current="true"] {
      background: var(--text);
      color: #0d121a;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .day-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(104px, 1fr);
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .day-strip button {
      display: grid;
      align-content: center;
      gap: 2px;
      min-height: 54px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .day-strip span {
      overflow: hidden;
      text-overflow: ellipsis;
      color: inherit;
      font-size: 0.72rem;
      opacity: 0.8;
      white-space: nowrap;
    }

    .primary-btn, .ghost-btn, .mini-btn {
      min-height: var(--tap);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius);
      font-weight: 900;
    }

    .primary-btn {
      padding: 0 14px;
      background: var(--accent);
      color: #08111f;
      box-shadow: 0 12px 26px rgba(143, 183, 255, 0.18);
    }

    .ghost-btn {
      padding: 0 13px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .ghost-btn.danger, .mini-btn.danger {
      color: var(--danger);
      border-color: rgba(255, 138, 147, 0.42);
    }

    .mini-btn {
      width: 42px;
      height: 42px;
      min-height: 42px;
      flex: 0 0 auto;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 0;
    }

    .mini-btn.primary {
      background: var(--text);
      color: #111722;
      border-color: var(--text);
    }

    .panel {
      background: rgba(23, 28, 36, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
      margin: 16px 0 9px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.15;
    }

    .muted, .section-title span {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.3;
    }

    .actions, .form-grid, .row-actions {
      display: grid;
      gap: 8px;
    }

    .actions {
      grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
      margin-bottom: 12px;
    }

    .form-grid {
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
    }

    .session-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      min-height: 48px;
      background: rgba(23, 28, 36, 0.62);
      border-color: rgba(44, 53, 68, 0.78);
      box-shadow: none;
    }

    .session-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .session-head h2 {
      margin: 0;
      font-size: 1.12rem;
    }

    .session-strip-main {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
    }

    .session-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 950;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .session-time {
      font-size: 1.04rem;
      font-weight: 950;
      color: var(--text);
      letter-spacing: 0;
    }

    .session-meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .session-edit-btn {
      min-height: 34px;
      padding: 0 10px;
    }

    .voice-panel {
      padding: 12px;
    }

    .voice-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .voice-grid textarea {
      min-height: 46px;
      height: 46px;
      max-height: 132px;
      padding-top: 11px;
    }

    .field label {
      display: block;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .exercise-card, .day-card, .chart-card, .drive-card {
      overflow: hidden;
    }

    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 13px 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    .card-head h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.18;
    }

    .chip-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1;
      background: #253142;
      color: #c7d7ea;
      white-space: nowrap;
    }

    .pill.green { background: #123427; color: #bdf3d0; }
    .pill.gold { background: #3a2913; color: #ffd79a; }

    .set-form {
      display: grid;
      grid-template-columns: minmax(112px, 1fr) 70px 70px minmax(96px, 1fr) auto;
      gap: 7px;
      padding: 10px 12px;
      align-items: end;
      border-bottom: 1px solid var(--line);
    }

    .weight-field {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 6px;
    }

    .set-list, .exercise-list, .plan-blocks {
      display: grid;
    }

    .set-row, .exercise-row, .block-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 52px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .exercise-row, .block-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .set-row:last-child, .exercise-row:last-child, .block-row:last-child {
      border-bottom: 0;
    }

    .set-num {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 950;
    }

    .row-main {
      min-width: 0;
    }

    .row-main b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-main span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.76rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 16px 12px;
      color: var(--muted);
      text-align: center;
      font-size: 0.84rem;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }

    .chart-card {
      padding: 12px;
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .trend-svg {
      width: 100%;
      height: 190px;
      display: block;
      overflow: visible;
    }

    .standard-bar {
      position: relative;
      height: 10px;
      margin: 12px 0 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #435065, #8fb7ff, #74e6ad, #ffd08a);
    }

    .standard-marker {
      position: absolute;
      top: -5px;
      width: 4px;
      height: 20px;
      border-radius: 999px;
      background: var(--text);
      box-shadow: 0 0 0 2px #111722;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(14, 17, 22, 0.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .bottom-nav-inner {
      width: min(100%, 1040px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .bottom-nav button {
      min-height: 48px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
    }

    .bottom-nav button[aria-selected="true"] {
      background: var(--panel-2);
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: end center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.52);
    }

    .modal-panel {
      width: min(100%, 560px);
      max-height: min(88vh, 760px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(78px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(calc(100% - 28px), 520px);
      margin: 0 auto;
      padding: 12px 13px;
      border-radius: var(--radius);
      background: var(--text);
      color: #10141b;
      font-weight: 850;
      box-shadow: var(--shadow);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .segmented { display: none; }
      .sync-chip span:last-child { display: none; }
      .voice-grid {
        grid-template-columns: auto 1fr;
      }
      .voice-grid button:last-child {
        grid-column: 1 / -1;
      }
      .set-form {
        grid-template-columns: 1fr 70px 70px auto;
      }
      .notes-field {
        grid-column: 1 / -1;
      }
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { h, render } = preact;
    const { useEffect, useMemo, useRef, useState } = preactHooks;

    const STORAGE_KEY = "workout-log-v2";
    const LEGACY_STORAGE_KEY = "workout-log-v1";
    const DB_NAME = "workout-log-db";
    const DB_VERSION = 2;
    const DB_STORE = "keyval";
    const DRIVE_STATE_FILE = "workout-log-state.json";
    const GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
    const GOOGLE_OAUTH_CLIENT_ID = "565625887082-vfb55neduq0bj9trrcgonntckj44mt4d.apps.googleusercontent.com";
    const DRIVE_AUTO_SYNC_DELAY = 2600;
    const BAR_WEIGHT = 45;
    const PLATES = [45, 35, 25, 10, 5, 2.5];

    const muscles = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Quads", "Hamstrings", "Glutes", "Calves", "Core", "Cardio"];
    const patterns = ["squat", "hinge", "press", "pull", "carry", "lunge", "core", "cardio"];
    const dayTypes = ["Strength", "Cardio", "Mobility", "Rest", "Custom"];
    const standardLevels = ["untrained", "novice", "intermediate", "advanced", "elite"];
    const bodyweightBrackets = [120, 150, 180, 210, 240, 270];
    const ageBrackets = ["18-39", "40-49", "50-59", "60-69"];
    const strengthStandardModels = {
      "bench-press": { lift: "Bench Press", aliases: ["bench-press"], male: [0.65, 0.92, 1.23, 1.58, 1.95], female: [0.38, 0.55, 0.75, 0.95, 1.15] },
      squat: { lift: "Squat", aliases: ["front-squat", "leg-press"], male: [0.85, 1.2, 1.55, 1.95, 2.45], female: [0.55, 0.8, 1.05, 1.35, 1.65] },
      deadlift: { lift: "Deadlift", aliases: ["deadlift", "romanian-deadlift"], male: [1.0, 1.35, 1.75, 2.25, 2.75], female: [0.7, 1.0, 1.35, 1.7, 2.05] },
      "overhead-press": { lift: "Overhead Press", aliases: ["overhead-press"], male: [0.38, 0.55, 0.72, 0.95, 1.12], female: [0.24, 0.35, 0.48, 0.62, 0.78] },
      "barbell-row": { lift: "Barbell Row", aliases: ["seated-cable-row", "wide-cable-row"], male: [0.62, 0.88, 1.15, 1.45, 1.75], female: [0.42, 0.6, 0.82, 1.02, 1.22] },
      "pull-up": { lift: "Pull-up", aliases: ["lat-pulldown-close", "lat-pulldown-wide"], male: [0.45, 0.65, 0.9, 1.12, 1.35], female: [0.28, 0.42, 0.58, 0.74, 0.9] }
    };

    function ex(id, name, primary, secondary, pattern, rest, sets, reps, aliases = []) {
      return {
        id,
        name,
        primary_muscle: primary,
        secondary_muscles: secondary,
        movement_pattern: pattern,
        default_rest_seconds: rest,
        default_sets: sets,
        default_rep_range: reps,
        demo_video_url: "",
        notes: "",
        aliases,
        updated_at: new Date(0).toISOString()
      };
    }

    const defaultExercises = [
      ex("bench-press", "Bench Press", "Chest", ["Triceps", "Shoulders"], "press", 180, 3, "4-6", ["bench", "barbell bench"]),
      ex("incline-db-press", "Incline DB Press", "Chest", ["Shoulders", "Triceps"], "press", 150, 2, "6-10", ["incline press", "incline dumbbell press"]),
      ex("lat-pulldown-close", "Lat Pulldown, Close Neutral", "Back", ["Biceps"], "pull", 120, 2, "8-10", ["close lat pulldown", "neutral pulldown", "lat pulldown"]),
      ex("seated-cable-row", "Seated Cable Row", "Back", ["Biceps"], "pull", 120, 2, "10-12", ["seated row", "cable row"]),
      ex("barbell-curl", "Barbell Curl", "Biceps", [], "pull", 90, 2, "8-10", ["curl"]),
      ex("hammer-curl", "Hammer Curl", "Biceps", [], "pull", 75, 1, "10-15", ["hammer curls"]),
      ex("front-squat", "Front Squat", "Quads", ["Glutes", "Core"], "squat", 180, 2, "4-6", ["front squats"]),
      ex("leg-press", "Leg Press", "Quads", ["Glutes"], "squat", 150, 2, "8-12", []),
      ex("leg-extension", "Leg Extension", "Quads", [], "squat", 75, 2, "10-15", ["leg extensions"]),
      ex("romanian-deadlift", "Romanian Deadlift", "Hamstrings", ["Glutes", "Back"], "hinge", 180, 2, "8-10", ["rdl"]),
      ex("leg-curl", "Leg Curl", "Hamstrings", [], "hinge", 75, 2, "10-15", ["leg curls"]),
      ex("standing-calf-raise", "Standing Calf Raise", "Calves", [], "carry", 60, 3, "12-15", ["calf raise", "standing calves"]),
      ex("overhead-press", "Overhead Press", "Shoulders", ["Triceps"], "press", 180, 2, "4-6", ["ohp", "shoulder press"]),
      ex("lateral-raise", "Lateral Raise", "Shoulders", [], "press", 60, 2, "12-15", ["side raise", "lateral raises"]),
      ex("lat-pulldown-wide", "Lat Pulldown, Wide", "Back", ["Biceps"], "pull", 120, 2, "8-10", ["wide pulldown", "wide lat pulldown"]),
      ex("wide-cable-row", "Cable Row, Wide", "Back", ["Biceps"], "pull", 120, 2, "10-12", ["wide row"]),
      ex("tricep-pushdown", "Tricep Pushdown", "Triceps", [], "press", 75, 2, "10-15", ["pushdown", "triceps pushdown"]),
      ex("overhead-tricep-extension", "Overhead Tricep Extension", "Triceps", [], "press", 75, 1, "10-15", ["overhead extension", "triceps extension"]),
      ex("deadlift", "Deadlift", "Hamstrings", ["Glutes", "Back"], "hinge", 240, 2, "4-6", ["deadlifts"]),
      ex("bulgarian-split-squat", "Bulgarian Split Squat", "Quads", ["Glutes"], "lunge", 120, 2, "8-10", ["bulgarian", "split squat"]),
      ex("hip-thrust", "Hip Thrust", "Glutes", ["Hamstrings"], "hinge", 150, 2, "10-12", ["hip thrusts"])
    ];

    function defaultDriveSettings() {
      return { provider: "google-drive", clientId: "", fileName: DRIVE_STATE_FILE, fileId: "", connectedAt: "", lastSyncAt: "", lastStatus: "", autoSync: true };
    }

    function createDefaultState() {
      const exercises = defaultExercises.map((item) => ({ ...item }));
      const programs = [createProgramFromTemplate("Upper/Lower", "Upper/Lower", 4, exercises)];
      return {
        schema_version: 2,
        view: "log",
        activeDate: todayISO(),
        activeProgramId: programs[0].id,
        activeDayId: programs[0].days[0].id,
        editPlan: false,
        exercises,
        programs,
        sessions: [],
        sets: [],
        drafts: {},
        command: "",
        profile: { sex: "male", bodyweight_lb: "", age: "", height: "" },
        settings: { muted: false, drive: defaultDriveSettings() },
        csvPreview: null
      };
    }

    function createProgramFromTemplate(name, split, daysPerWeek, exercises) {
      const map = Object.fromEntries(exercises.map((item) => [item.id, item]));
      const templates = {
        "Upper/Lower": [
          ["Upper A", ["bench-press", "incline-db-press", "lat-pulldown-close", "seated-cable-row", "barbell-curl", "hammer-curl"]],
          ["Lower A", ["front-squat", "leg-press", "leg-extension", "romanian-deadlift", "leg-curl", "standing-calf-raise"]],
          ["Upper B", ["overhead-press", "lateral-raise", "lat-pulldown-wide", "wide-cable-row", "tricep-pushdown", "overhead-tricep-extension"]],
          ["Lower B", ["deadlift", "bulgarian-split-squat", "hip-thrust", "leg-curl", "leg-extension", "standing-calf-raise"]]
        ],
        "Push/Pull/Legs": [
          ["Push", ["bench-press", "incline-db-press", "overhead-press", "lateral-raise", "tricep-pushdown"]],
          ["Pull", ["deadlift", "lat-pulldown-wide", "seated-cable-row", "barbell-curl", "hammer-curl"]],
          ["Legs", ["front-squat", "leg-press", "romanian-deadlift", "leg-curl", "standing-calf-raise"]]
        ],
        "Full Body": [
          ["Full A", ["front-squat", "bench-press", "seated-cable-row", "leg-curl"]],
          ["Full B", ["deadlift", "overhead-press", "lat-pulldown-wide", "leg-extension"]],
          ["Full C", ["leg-press", "incline-db-press", "wide-cable-row", "standing-calf-raise"]]
        ]
      };
      const source = templates[split] || templates["Upper/Lower"];
      const days = Array.from({ length: daysPerWeek }, (_, index) => {
        const template = source[index % source.length] || [`Day ${index + 1}`, []];
        return {
          id: cryptoId(),
          label: template[0],
          type: "Strength",
          order: index,
          blocks: template[1].filter((id) => map[id]).map((id, blockIndex) => blockFromExercise(map[id], blockIndex))
        };
      });
      return { id: cryptoId(), name, split, days, created_at: nowISO(), updated_at: nowISO() };
    }

    function blockFromExercise(exercise, order = 0) {
      return { id: cryptoId(), exercise_id: exercise.id, sets: exercise.default_sets || 3, rep_range: exercise.default_rep_range || "8-12", rest_seconds: exercise.default_rest_seconds || 120, order, updated_at: nowISO() };
    }

    const K3V_Storage = {
      async load() {
        const saved = await this.readStoredState();
        return normalizeState(saved);
      },
      async readStoredState() {
        try {
          const saved = await this.idbGet(STORAGE_KEY);
          if (saved) return saved;
        } catch {}
        for (const key of [STORAGE_KEY, LEGACY_STORAGE_KEY]) {
          try {
            const saved = JSON.parse(localStorage.getItem(key));
            if (saved) return saved;
          } catch {}
        }
        return null;
      },
      save(state) {
        const snapshot = JSON.parse(JSON.stringify({ ...state, csvPreview: null }));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch {}
        this.idbSet(STORAGE_KEY, snapshot).catch(() => {});
      },
      openDB() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) return reject(new Error("IndexedDB unavailable"));
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },
      async idbGet(key) {
        const db = await this.openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const request = tx.objectStore(DB_STORE).get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          tx.oncomplete = () => db.close();
        });
      },
      async idbSet(key, value) {
        const db = await this.openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readwrite");
          tx.objectStore(DB_STORE).put(value, key);
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => reject(tx.error);
        });
      }
    };

    const K3V_SyncEngine = (() => {
      let googleAccessToken = "";
      let googleTokenClient = null;
      let syncTimer = null;
      let inFlight = false;
      let dirty = false;

      function clientId(state) {
        return GOOGLE_OAUTH_CLIENT_ID || cleanValue(state.settings?.drive?.clientId || "");
      }

      function canSync(state) {
        return Boolean(clientId(state)) && Boolean(googleAccessToken) && state.settings?.drive?.autoSync !== false && navigator.onLine !== false;
      }

      function schedule(state, callbacks, delay = DRIVE_AUTO_SYNC_DELAY) {
        if (!canSync(state)) return;
        dirty = true;
        window.clearTimeout(syncTimer);
        syncTimer = window.setTimeout(() => run(state, callbacks, { silent: true }), delay);
      }

      async function connect(state, callbacks) {
        await ensureGoogleDriveToken(state, true);
        const next = cloneState(state);
        next.settings.drive.connectedAt = nowISO();
        next.settings.drive.autoSync = true;
        next.settings.drive.lastStatus = "Google Drive connected. K3VSYNC is syncing now.";
        callbacks.onState(next, { localOnly: true });
        return run(next, callbacks, { silent: false });
      }

      async function run(state, callbacks, options = {}) {
        if (inFlight) {
          dirty = true;
          return state;
        }
        inFlight = true;
        dirty = false;
        window.clearTimeout(syncTimer);
        callbacks.onStatus({ state: "syncing", label: "Syncing..." });
        let working = cloneState(state);
        try {
          await ensureGoogleDriveToken(working, false);
          const remote = await pullDriveState(working);
          if (remote) working = deepUnionMerge(working, remote);
          await pushDriveState(working);
          working.settings.drive.lastSyncAt = nowISO();
          working.settings.drive.lastStatus = "K3VSYNC deep-union sync complete.";
          callbacks.onState(working, { localOnly: true });
          callbacks.onStatus({ state: "synced", label: "Synced" });
          if (!options.silent) callbacks.onToast("Google Drive synced.");
        } catch (error) {
          working.settings.drive.lastStatus = `Google Drive sync failed: ${error.message}`;
          callbacks.onState(working, { localOnly: true });
          callbacks.onStatus({ state: "error", label: "Sync issue" });
          if (!options.silent) callbacks.onToast(error.message);
          throw error;
        } finally {
          inFlight = false;
          if (dirty) {
            dirty = false;
            schedule(working, callbacks, 400);
          }
        }
        return working;
      }

      function ensureGoogleDriveToken(state, forcePrompt = false) {
        return new Promise((resolve, reject) => {
          const id = clientId(state);
          if (!id) return reject(new Error("Google OAuth client is missing."));
          if (googleAccessToken && !forcePrompt) return resolve(googleAccessToken);
          if (!window.google?.accounts?.oauth2) return reject(new Error("Google Identity Services is still loading."));
          googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: id,
            scope: GOOGLE_DRIVE_SCOPE,
            callback: (response) => {
              if (response.error) return reject(new Error(response.error_description || response.error));
              googleAccessToken = response.access_token;
              resolve(googleAccessToken);
            }
          });
          googleTokenClient.requestAccessToken({ prompt: forcePrompt ? "consent" : "" });
        });
      }

      async function pullDriveState(state) {
        const file = await findDriveStateFile(state);
        if (!file) return null;
        const response = await googleDriveRequest(state, `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`);
        const parsed = JSON.parse(await response.text());
        const remote = normalizeState(parsed.state || parsed);
        remote.settings.drive.fileId = file.id;
        return remote;
      }

      async function pushDriveState(state) {
        const file = await findDriveStateFile(state);
        const content = backupPayload(state);
        if (file) {
          await googleDriveRequest(state, `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media&fields=id,name,modifiedTime`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: content
          });
          state.settings.drive.fileId = file.id;
          return;
        }
        const created = await createDriveStateFile(state, content);
        state.settings.drive.fileId = created.id;
      }

      async function findDriveStateFile(state) {
        const fileName = state.settings.drive?.fileName || DRIVE_STATE_FILE;
        const q = encodeURIComponent(`name='${fileName.replace(/'/g, "\\'")}'`);
        const response = await googleDriveRequest(state, `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&pageSize=1&fields=files(id,name,modifiedTime)`);
        const data = await response.json();
        return data.files?.[0] || null;
      }

      async function createDriveStateFile(state, content) {
        const boundary = `k3vsync-${Date.now()}`;
        const metadata = { name: state.settings.drive?.fileName || DRIVE_STATE_FILE, parents: ["appDataFolder"], mimeType: "application/json" };
        const body = [
          `--${boundary}`,
          "Content-Type: application/json; charset=UTF-8",
          "",
          JSON.stringify(metadata),
          `--${boundary}`,
          "Content-Type: application/json",
          "",
          content,
          `--${boundary}--`
        ].join("\r\n");
        const response = await googleDriveRequest(state, "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime", {
          method: "POST",
          headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
          body
        });
        return response.json();
      }

      async function googleDriveRequest(state, url, options = {}) {
        const token = await ensureGoogleDriveToken(state, false);
        const response = await fetch(url, {
          ...options,
          headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
        });
        if (response.status === 401) {
          googleAccessToken = "";
          throw new Error("Google session expired. Sign in again.");
        }
        if (!response.ok) throw new Error(await googleErrorMessage(response));
        return response;
      }

      async function googleErrorMessage(response) {
        try {
          const data = await response.json();
          return data.error?.message || `Google Drive request failed (${response.status})`;
        } catch {
          return `Google Drive request failed (${response.status})`;
        }
      }

      function deepUnionMerge(local, remote) {
        const merged = normalizeState({
          ...local,
          exercises: mergeRecords(local.exercises, remote.exercises),
          sessions: mergeRecords(local.sessions, remote.sessions),
          sets: mergeRecords(local.sets, remote.sets),
          programs: mergePrograms(local.programs, remote.programs),
          profile: mergeProfile(local.profile, remote.profile),
          settings: { ...local.settings, drive: local.settings.drive }
        });
        if (remote.settings?.drive?.fileId) merged.settings.drive.fileId = remote.settings.drive.fileId;
        return merged;
      }

      function mergeRecords(localItems = [], remoteItems = []) {
        const map = new Map();
        [...localItems, ...remoteItems].forEach((item) => {
          if (!item?.id) return;
          const previous = map.get(item.id);
          if (!previous || newer(item, previous)) map.set(item.id, { ...previous, ...item });
        });
        return [...map.values()];
      }

      function mergePrograms(localPrograms = [], remotePrograms = []) {
        const map = new Map();
        [...localPrograms, ...remotePrograms].forEach((program) => {
          if (!program?.id) return;
          const previous = map.get(program.id);
          if (!previous) {
            map.set(program.id, cloneState(program));
            return;
          }
          const base = newer(program, previous) ? { ...previous, ...program } : { ...program, ...previous };
          base.days = mergeDays(previous.days || [], program.days || []);
          map.set(program.id, base);
        });
        return [...map.values()];
      }

      function mergeDays(localDays = [], remoteDays = []) {
        const map = new Map();
        [...localDays, ...remoteDays].forEach((day) => {
          if (!day?.id) return;
          const previous = map.get(day.id);
          if (!previous) {
            map.set(day.id, cloneState(day));
            return;
          }
          const base = newer(day, previous) ? { ...previous, ...day } : { ...day, ...previous };
          base.blocks = mergeRecords(previous.blocks || [], day.blocks || []).sort(byOrder);
          map.set(day.id, base);
        });
        return [...map.values()].sort(byOrder);
      }

      function newer(a, b) {
        return String(a.updated_at || a.created_at || "") >= String(b.updated_at || b.created_at || "");
      }

      function mergeProfile(local = {}, remote = {}) {
        return { ...remote, ...local, updated_at: local.updated_at || remote.updated_at || nowISO() };
      }

      return { schedule, connect, run, deepUnionMerge, isConnected: () => Boolean(googleAccessToken) };
    })();

    const K3V_UI_Components = {
      Trendline({ exercise, sets }) {
        const points = trendPoints(sets);
        if (!points.length) return h("div", { class: "empty" }, "Log sets to build a PR trendline.");
        const width = 520;
        const height = 190;
        const pad = 24;
        const minY = Math.min(...points.map((p) => p.e1rm)) * 0.94;
        const maxY = Math.max(...points.map((p) => p.e1rm)) * 1.04 || 1;
        const minX = Math.min(...points.map((p) => p.time));
        const maxX = Math.max(...points.map((p) => p.time));
        const x = (p) => maxX === minX ? width / 2 : pad + ((p.time - minX) / (maxX - minX)) * (width - pad * 2);
        const y = (p) => height - pad - ((p.e1rm - minY) / Math.max(1, maxY - minY)) * (height - pad * 2);
        const d = points.map((p, index) => `${index ? "L" : "M"}${x(p).toFixed(1)} ${y(p).toFixed(1)}`).join(" ");
        let best = 0;
        const prPoints = points.filter((p) => {
          if (p.e1rm > best) {
            best = p.e1rm;
            return true;
          }
          return false;
        });
        return h("svg", { class: "trend-svg", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `${exercise.name} PR trendline` },
          h("path", { d: `M${pad} ${height - pad}H${width - pad}M${pad} ${pad}V${height - pad}`, fill: "none", stroke: "#3d4b5d", "stroke-width": "1" }),
          h("path", { d, fill: "none", stroke: "#8fb7ff", "stroke-width": "3", "stroke-linecap": "round", "stroke-linejoin": "round" }),
          points.map((p) => h("circle", { key: `${p.date}-${p.e1rm}`, cx: x(p), cy: y(p), r: 3, fill: "#f5f8fc" })),
          prPoints.map((p) => h("g", { key: `pr-${p.date}-${p.e1rm}` },
            h("circle", { cx: x(p), cy: y(p), r: 6, fill: "#74e6ad", stroke: "#0e1116", "stroke-width": "2" }),
            h("text", { x: Math.min(width - 76, x(p) + 8), y: Math.max(14, y(p) - 8), fill: "#74e6ad", "font-size": "11", "font-weight": "800" }, `PR ${Math.round(p.e1rm)}`)
          )),
          h("text", { x: pad, y: 14, fill: "#9ca9b8", "font-size": "11" }, `${Math.round(maxY)} lb`),
          h("text", { x: pad, y: height - 5, fill: "#9ca9b8", "font-size": "11" }, `${Math.round(minY)} lb`)
        );
      },
      PlateModal({ weight, onClose }) {
        const target = Number(weight) || BAR_WEIGHT;
        const result = calculatePlates(target);
        return h(Modal, { title: "Plate Calculator", onClose },
          h("div", { class: "stack" },
            h("p", { class: "muted" }, `Target: ${formatWeight(target)} on a 45 lb bar.`),
            h("div", { class: "panel", style: "padding:12px" },
              h("h3", null, result.loadable ? `${result.perSide} lb per side` : "Below bar weight"),
              h("p", { class: "muted" }, result.loadable ? `Each side: ${result.plates.length ? result.plates.join(" + ") : "no plates"}` : "Use the empty bar or a lighter implement.")
            ),
            h("button", { class: "primary-btn", type: "button", onClick: onClose }, "Done")
          )
        );
      }
    };

    function K3V_App() {
      const [state, setState] = useState(null);
      const [syncStatus, setSyncStatus] = useState({ state: "idle", label: "Local" });
      const [toast, setToast] = useState("");
      const [modal, setModal] = useState(null);
      const [clock, setClock] = useState(Date.now());
      const [listening, setListening] = useState(false);
      const recognitionRef = useRef(null);
      const stateRef = useRef(null);
      const fileJsonRef = useRef(null);
      const fileCsvRef = useRef(null);

      useEffect(() => {
        K3V_Storage.load().then((loaded) => {
          stateRef.current = loaded;
          setState(loaded);
        });
        registerServiceWorker();
      }, []);

      useEffect(() => {
        const id = window.setInterval(() => setClock(Date.now()), 1000);
        return () => window.clearInterval(id);
      }, []);

      useEffect(() => {
        const online = () => stateRef.current && K3V_SyncEngine.schedule(stateRef.current, callbacks(), 250);
        const visible = () => !document.hidden && stateRef.current && K3V_SyncEngine.schedule(stateRef.current, callbacks(), 300);
        const pageHide = () => stateRef.current && K3V_SyncEngine.run(stateRef.current, callbacks(), { silent: true }).catch(() => {});
        window.addEventListener("online", online);
        document.addEventListener("visibilitychange", visible);
        window.addEventListener("pagehide", pageHide);
        return () => {
          window.removeEventListener("online", online);
          document.removeEventListener("visibilitychange", visible);
          window.removeEventListener("pagehide", pageHide);
        };
      }, []);

      function callbacks() {
        return {
          onState: applyRemoteState,
          onStatus: setSyncStatus,
          onToast: showToast
        };
      }

      function showToast(message) {
        setToast(message);
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => setToast(""), 2600);
      }

      function applyRemoteState(next, options = {}) {
        const normalized = normalizeState(next);
        stateRef.current = normalized;
        setState(normalized);
        K3V_Storage.save(normalized);
        if (!options.localOnly) K3V_SyncEngine.schedule(normalized, callbacks());
      }

      function updateState(mutator, options = {}) {
        setState((previous) => {
          const base = cloneState(previous || createDefaultState());
          const next = mutator(base) || base;
          const normalized = normalizeState(next);
          stateRef.current = normalized;
          K3V_Storage.save(normalized);
          if (!options.localOnly) K3V_SyncEngine.schedule(normalized, callbacks(), options.syncDelay || DRIVE_AUTO_SYNC_DELAY);
          return normalized;
        });
      }

      if (!state) return h("main", { class: "app-shell" }, h("div", { class: "empty panel" }, "Loading K3VSYNC..."));

      const program = getProgram(state);
      const day = getDay(state);
      const activeSets = setsForDate(state, state.activeDate);
      const views = [
        ["log", "Log"],
        ["progress", "Stats"],
        ["plan", "Plan"],
        ["exercises", "Exercises"],
        ["sync", "Drive"]
      ];

      return h("div", null,
        h("main", { class: "app-shell" },
          h("header", { class: "topbar" },
            h("div", { class: "brand" },
              h("div", { class: "brand-mark" }, "K3V"),
              h("div", null,
                h("h1", null, "K3VSYNC"),
                h("p", null, `${day?.label || "Workout"} / ${activeSets.length} sets / ${formatNumber(activeSets.reduce((sum, set) => sum + volume(set), 0))} lb`)
              )
            ),
            h("div", { class: "sync-chip", "data-state": syncStatus.state },
              h("i", { class: "sync-dot" }),
              h("span", null, syncStatus.label)
            )
          ),
          h("section", { class: "toolbar" },
            h("nav", { class: "segmented", "aria-label": "Primary" },
              views.map(([id, label]) => h("button", { key: id, type: "button", "aria-selected": state.view === id, onClick: () => updateState((draft) => { draft.view = id; }, { localOnly: true }) }, label))
            ),
            h("div", { class: "date-row" },
              h("input", { type: "date", value: state.activeDate, onInput: (event) => updateState((draft) => { draft.activeDate = event.currentTarget.value || todayISO(); }, { localOnly: true }) }),
              h("button", { class: "ghost-btn", type: "button", onClick: () => updateState((draft) => { draft.activeDate = todayISO(); }, { localOnly: true }) }, "Today")
            ),
            h("div", { class: "day-strip", "aria-label": "Workout day" },
              (program?.days || []).sort(byOrder).map((item, index) => h("button", { key: item.id, type: "button", "aria-current": item.id === state.activeDayId, onClick: () => updateState((draft) => { draft.activeDayId = item.id; }, { localOnly: true }) },
                h("strong", null, shortDayLabel(index, item.label)),
                h("span", null, item.label)
              ))
            )
          ),
          state.view === "log" && h(LogView, { state, updateState, showToast, openModal: setModal, clock, listening, setListening, recognitionRef }),
          state.view === "progress" && h(ProgressView, { state, updateState }),
          state.view === "plan" && h(PlanView, { state, updateState, showToast, openModal: setModal }),
          state.view === "exercises" && h(ExercisesView, { state, updateState, showToast, openModal: setModal }),
          state.view === "sync" && h(DriveView, { state, updateState, showToast, syncStatus, connect: () => K3V_SyncEngine.connect(stateRef.current, callbacks()).catch(() => {}), syncNow: () => K3V_SyncEngine.run(stateRef.current, callbacks()).catch(() => {}), fileJsonRef, fileCsvRef })
        ),
        h("nav", { class: "bottom-nav", "aria-label": "Primary" },
          h("div", { class: "bottom-nav-inner" }, views.map(([id, label]) => h("button", { key: id, type: "button", "aria-selected": state.view === id, onClick: () => updateState((draft) => { draft.view = id; }, { localOnly: true }) }, label)))
        ),
        h("input", { ref: fileJsonRef, class: "sr-only", type: "file", accept: "application/json,.json", onChange: (event) => importJSONFile(event, updateState, showToast) }),
        h("input", { ref: fileCsvRef, class: "sr-only", type: "file", accept: ".csv,text/csv", onChange: (event) => importCSVFile(event, updateState, showToast) }),
        modal,
        toast && h("div", { class: "toast", role: "status" }, toast)
      );
    }

    function LogView({ state, updateState, showToast, openModal, clock, listening, setListening, recognitionRef }) {
      const day = getDay(state);
      const blocks = (day?.blocks || []).slice().sort(byOrder);
      return h("section", { class: "stack" },

    function SessionPanel({ state, updateState, clock, showToast, openModal }) {

    function addSet(state, block, updateState, showToast) {
      const draft = state.drafts[block.id] || {};
      const reps = Number(draft.reps);
      const weight = parseWeight(draft.weight_lb);
      if (!Number.isFinite(reps) || reps <= 0 || !Number.isFinite(weight)) {
        showToast("Weight and reps are needed.");
        return;
      }
      updateState((next) => {
        appendSet(next, block, weight, reps, draft.rpe || "", draft.notes || "");
        next.drafts[block.id] = { weight_lb: String(weight), reps: "", rpe: draft.rpe || "", notes: "" };
      });
      showToast(`${getExercise(state, block.exercise_id)?.name || "Set"}: ${weight} x ${reps}`);
    }

    function addWarmups(state, block, updateState, showToast) {
      const draft = state.drafts[block.id] || {};
      const target = parseWeight(draft.weight_lb) || lastWeightForExercise(state, block.exercise_id) || BAR_WEIGHT;
      const warmups = [[0.5, 5], [0.7, 3], [0.85, 1]].map(([percent, reps]) => [roundToPlate(target * percent), reps, `${Math.round(percent * 100)}% warm-up`]);
      updateState((next) => {
        warmups.forEach(([weight, reps, notes]) => appendSet(next, block, weight, reps, "", notes));
      });
      showToast("Warm-up sets added.");
    }

    function toggleVoice(state, updateState, showToast, listening, setListening, recognitionRef) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast("Voice entry is not available in this browser.");
        return;
      }
      if (listening && recognitionRef.current) {
        recognitionRef.current.stop();
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onstart = () => setListening(true);
      recognition.onend = () => setListening(false);
      recognition.onerror = () => {
        setListening(false);
        showToast("Voice entry stopped.");
      };
      recognition.onresult = (event) => {
        const text = Array.from(event.results).map((result) => result[0]?.transcript || "").join(" ").trim();
        updateState((draft) => { draft.command = text; }, { localOnly: true });
        const final = Array.from(event.results).some((result) => result.isFinal);
        if (final) {
          const next = cloneState(state);
          next.command = text;
          const result = parseVoiceCommand(next, updateState);
          showToast(result.message);
        }
      };
      recognitionRef.current = recognition;
      recognition.start();
    }

    function parseVoiceCommand(state, updateState) {
      const raw = cleanValue(state.command);
      if (!raw) return { ok: false, message: "No command text." };
      const match = findExerciseMatch(state, raw);
      if (!match) return { ok: false, message: "No matching exercise." };
      const sets = extractSets(raw, match.alias);
      if (!sets.length) return { ok: false, message: "No weight and reps found." };
      updateState((draft) => {
        let day = getDay(draft);
        let block = day.blocks.find((item) => item.exercise_id === match.exercise.id);
        if (!block) {
          block = blockFromExercise(match.exercise, day.blocks.length);
          day.blocks.push(block);
          day.updated_at = nowISO();
        }
        sets.forEach((item) => appendSet(draft, block, Number(item.weight_lb), Number(item.reps), item.rpe || "", item.notes || ""));
        draft.command = "";
      });
      return { ok: true, message: `${sets.length} set${sets.length === 1 ? "" : "s"} added.` };
    }

    function findExerciseMatch(state, text) {
      const normalized = normalizeText(text);
      const matches = [];
      state.exercises.forEach((exercise) => {
        [exercise.name, ...(exercise.aliases || [])].map(normalizeText).forEach((alias) => {
          if (alias && normalized.includes(alias)) matches.push({ exercise, alias, score: alias.length });
        });
      });
      matches.sort((a, b) => b.score - a.score);
      return matches[0] || null;
    }

    function extractSets(text, alias) {
      let body = normalizeText(text)
        .replace(alias, " ")
        .replace(/\b(add|set|sets|logged|log|did|pounds|pound|lbs|lb|reps|rep)\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      const rpeMatch = body.match(/\b(?:rpe|r p e)\s*(\d+(?:\.\d+)?)\b/);
      const rpe = rpeMatch ? rpeMatch[1] : "";
      if (rpeMatch) body = body.replace(rpeMatch[0], " ");
      const notesMatch = body.match(/\bnote\s+(.+)$/);
      const notes = notesMatch ? notesMatch[1].trim() : "";
      if (notesMatch) body = body.replace(notesMatch[0], " ");
      const sets = [];
      const pairPattern = /(\d+(?:\.\d+)?)\s*(?:x|by|for|with)\s*(\d{1,3})/g;
      let match;
      while ((match = pairPattern.exec(body))) sets.push({ weight_lb: match[1], reps: match[2], rpe, notes });
      if (sets.length) return sets;
      const numbers = body.match(/\d+(?:\.\d+)?/g) || [];
      for (let index = 0; index < numbers.length - 1; index += 2) sets.push({ weight_lb: numbers[index], reps: numbers[index + 1], rpe, notes });
      return sets;
    }

    function appendSet(state, block, weight, reps, rpe = "", notes = "") {
      const exercise = getExercise(state, block.exercise_id);
      const session = activeSession(state);
      const existing = state.sets.filter((set) => set.session_id === session.id && set.exercise_id === block.exercise_id);
      const now = nowISO();
      const timeLogged = new Date().toTimeString().slice(0, 8);
      state.sets.push({
        id: cryptoId(),
        session_id: session.id,
        date: state.activeDate,
        exercise_id: block.exercise_id,
        exercise: exercise?.name || "Exercise",
        set_number: existing.length + 1,
        reps,
        weight_lb: weight,
        rpe,
        notes,
        time_logged: timeLogged,
        created_at: now,
        updated_at: now
      });
      session.updated_at = now;
    }

    function activeSession(state) {
      let session = state.sessions.find((item) => item.date === state.activeDate && item.day_id === state.activeDayId);
      if (!session) {
        session = { id: cryptoId(), date: state.activeDate, program_id: state.activeProgramId, day_id: state.activeDayId, started_at: nowISO(), updated_at: nowISO(), paused_total_ms: 0, manual_duration_ms: null, notes: "" };
        state.sessions.push(session);
      }
      return session;
    }

    function sessionForActiveDate(state) {
      return state.sessions.find((item) => item.date === state.activeDate && item.day_id === state.activeDayId);
    }

    function sessionElapsedMs(session, clock = Date.now()) {
      if (!session) return 0;
      if (Number.isFinite(Number(session.manual_duration_ms))) return Math.max(0, Number(session.manual_duration_ms));
      const started = new Date(session.started_at || session.created_at || nowISO()).getTime();
      const paused = Number(session.paused_total_ms || 0);
      return Math.max(0, clock - started - paused);
    }

    function adjustSessionDuration(updateState, deltaMs) {
      updateState((draft) => {
        const session = activeSession(draft);
        session.manual_duration_ms = Math.max(0, sessionElapsedMs(session) + deltaMs);
        session.updated_at = nowISO();
        draft.sessionTimeDraft = "";
      });
    }

    function setSessionDurationFromDraft(state, updateState, showToast) {
      const ms = parseDurationInput(state.sessionTimeDraft);
      if (!Number.isFinite(ms)) {
        showToast("Use 75m, 1:15, or 1:15:00.");
        return;
      }
      updateState((draft) => {
        const session = activeSession(draft);
        session.manual_duration_ms = ms;
        session.updated_at = nowISO();
        draft.sessionTimeDraft = "";
      });
      showToast("Session time updated.");
    }

    function renumberSets(state, sessionId, exerciseId) {
      state.sets.filter((set) => set.session_id === sessionId && set.exercise_id === exerciseId).sort(sortRecords).forEach((set, index) => {
        set.set_number = index + 1;
        set.updated_at = nowISO();
      });
    }

    function createNewPlan(updateState, showToast) {
      updateState((draft) => {
        const plan = createProgramFromTemplate(`K3V Plan ${draft.programs.length + 1}`, "Upper/Lower", 4, draft.exercises);
        draft.programs.push(plan);
        draft.activeProgramId = plan.id;
        draft.activeDayId = plan.days[0]?.id;
      });
      showToast("New plan created.");
    }

    function createExercise(overrides = {}) {
      return {
        id: cryptoId(),
        name: overrides.name || "New Exercise",
        primary_muscle: overrides.primary_muscle || "Chest",
        secondary_muscles: overrides.secondary_muscles || [],
        movement_pattern: overrides.movement_pattern || "press",
        default_rest_seconds: Number(overrides.default_rest_seconds) || 120,
        default_sets: Number(overrides.default_sets) || 3,
        default_rep_range: overrides.default_rep_range || "8-12",
        demo_video_url: overrides.demo_video_url || "",
        notes: overrides.notes || "",
        aliases: overrides.aliases || [],
        updated_at: nowISO()
      };
    }

    function deleteExercise(id, updateState, showToast) {
      updateState((draft) => {
        const isUsed = draft.programs.some((program) => program.days.some((day) => day.blocks.some((block) => block.exercise_id === id)));
        if (isUsed) {
          showToast("Exercise is used in a plan. Remove the block first.");
          return draft;
        }
        draft.exercises = draft.exercises.filter((exercise) => exercise.id !== id);
      });
    }

    function backupPayload(state) {
      return JSON.stringify({ app: "K3VSYNC", version: 3, exported_at: nowISO(), state: { ...state, csvPreview: null } }, null, 2);
    }

    async function importJSONFile(event, updateState, showToast) {
      const file = event.currentTarget.files?.[0];
      event.currentTarget.value = "";
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        updateState(() => normalizeState(parsed.state || parsed));
        showToast("JSON import complete.");
      } catch {
        showToast("JSON import failed.");
      }
    }

    async function importCSVFile(event, updateState, showToast) {
      const file = event.currentTarget.files?.[0];
      event.currentTarget.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        updateState((draft) => {
          draft.csvPreview = previewCSV(draft, text);
        }, { localOnly: true });
      } catch (error) {
        showToast(error.message);
      }
    }

    function toCSV(sets) {
      const headers = ["date", "exercise", "set_number", "reps", "weight_lb", "rpe", "notes", "time_logged"];
      const rows = sets.slice().sort(sortRecords).map((set) => [set.date, set.exercise, set.set_number, set.reps, set.weight_lb, set.rpe, set.notes, set.time_logged]);
      return [headers, ...rows].map((row) => row.map(csvCell).join(",")).join("\n");
    }

    function csvCell(value) {
      return String(value ?? "").replace(/[\r\n,]/g, " ").trim();
    }

    function previewCSV(state, text) {
      const rows = parseCSV(text).map((item) => {
        if (item.errors.length) return { row: item.row, record: item.record, status: "errored", message: item.errors.join("; ") };
        const exercise = ensureExerciseByName(state, item.record.exercise);
        const id = csvRecordId(item.record);
        const existing = state.sets.find((set) => csvRecordId(set) === id);
        const status = existing ? "changed" : "added";
        return { row: item.row, record: { ...item.record, exercise_id: exercise.id }, status, message: "" };
      });
      return {
        rows,
        added: rows.filter((row) => row.status === "added").length,
        changed: rows.filter((row) => row.status === "changed").length,
        unchanged: rows.filter((row) => row.status === "unchanged").length,
        errored: rows.filter((row) => row.status === "errored").length
      };
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim());
      const headers = lines.shift()?.split(",").map((item) => item.trim()) || [];
      const expected = ["date", "exercise", "set_number", "reps", "weight_lb", "rpe", "notes"];
      const hasTimeLogged = headers.includes("time_logged");
      if (!expected.every((item) => headers.includes(item))) throw new Error("CSV headers must include date,exercise,set_number,reps,weight_lb,rpe,notes");
      return lines.map((line, index) => {
        const cells = line.split(",");
        const record = Object.fromEntries(headers.map((key, keyIndex) => [key, (cells[keyIndex] || "").trim()]));
        const errors = [];
        if (!/^\d{4}-\d{2}-\d{2}$/.test(record.date)) errors.push("bad ISO date");
        if (!record.exercise) errors.push("missing exercise");
        if (!Number(record.set_number)) errors.push("bad set_number");
        if (!Number(record.reps)) errors.push("bad reps");
        if (!Number(record.weight_lb)) errors.push("bad weight_lb");
        return { row: index + 2, record: { ...record, set_number: Number(record.set_number), reps: Number(record.reps), weight_lb: Number(record.weight_lb) }, errors };
      });
    }

    function commitCSVImport(updateState) {
      updateState((state) => {
        if (!state.csvPreview || state.csvPreview.errored) return;
        state.csvPreview.rows.filter((row) => row.status !== "unchanged" && row.status !== "errored").forEach((row) => {
          const record = row.record;
          const session = getOrCreateImportedSession(state, record.date);
          const id = csvRecordId(record);
          const existing = state.sets.findIndex((set) => csvRecordId(set) === id);
          const payload = {
            id: existing >= 0 ? state.sets[existing].id : cryptoId(),
            session_id: session.id,
            date: record.date,
            exercise_id: record.exercise_id,
            exercise: record.exercise,
            set_number: Number(record.set_number),
            reps: Number(record.reps),
            weight_lb: Number(record.weight_lb),
            rpe: record.rpe,
            notes: record.notes,
            time_logged: record.time_logged || "",
            created_at: existing >= 0 ? state.sets[existing].created_at : nowISO(),
            updated_at: nowISO()
          };
          if (existing >= 0) state.sets[existing] = payload;
          else state.sets.push(payload);
        });
        state.csvPreview = null;
      });
    }

    function ensureExerciseByName(state, name) {
      const existing = state.exercises.find((exercise) => normalizeText(exercise.name) === normalizeText(name));
      if (existing) return existing;
      const exercise = createExercise({ name });
      state.exercises.push(exercise);
      return exercise;
    }

    function getOrCreateImportedSession(state, date) {
      let session = state.sessions.find((item) => item.date === date && item.day_id === state.activeDayId);
      if (!session) {
        session = { id: cryptoId(), date, program_id: state.activeProgramId, day_id: state.activeDayId, started_at: nowISO(), updated_at: nowISO() };
        state.sessions.push(session);
      }
      return session;
    }

    function normalizeState(saved) {
      const fallback = createDefaultState();
      if (!saved || typeof saved !== "object") return fallback;
      if (saved.schema_version === 2 || saved.schema_version === 3) {
        const merged = { ...fallback, ...saved, schema_version: 3 };
        merged.exercises = mergeById(fallback.exercises, saved.exercises || []);
        merged.programs = saved.programs?.length ? saved.programs : fallback.programs;
        merged.sessions = saved.sessions || [];
        merged.sessions = merged.sessions.map((session) => ({ paused_total_ms: 0, manual_duration_ms: null, notes: "", ...session }));
        merged.sets = saved.sets || [];
        merged.drafts = saved.drafts || {};
        merged.command = saved.command || "";
        merged.profile = { ...fallback.profile, ...(saved.profile || {}) };
        merged.settings = { ...fallback.settings, ...(saved.settings || {}), drive: { ...defaultDriveSettings(), ...(saved.settings?.drive || {}) } };
        merged.view = ["log", "progress", "plan", "exercises", "sync"].includes(saved.view) ? saved.view : "log";
        if (!merged.activeProgramId || !getProgram(merged)) merged.activeProgramId = merged.programs[0]?.id;
        if (!merged.activeDayId || !getDay(merged)) merged.activeDayId = getProgram(merged)?.days[0]?.id;
        return merged;
      }
      return fallback;
    }

    function renderStandards(state) {
      const sex = state.profile.sex || "male";
      const bodyweight = Number(state.profile.bodyweight_lb) || 180;
      const age = Number(state.profile.age) || 30;
      const bracket = nearest(bodyweightBrackets, bodyweight);
      const ageBracket = ageToBracket(age);
      return Object.entries(strengthStandardModels).map(([liftId, model]) => {
        const standards = buildStrengthStandards().filter((row) => row.lift_id === liftId && row.sex === sex && row.bodyweight_bracket_lb === bracket && row.age_bracket === ageBracket);
        const best = bestE1RMForModel(state, model);
        const elite = standards.find((row) => row.level === "elite")?.one_rm_lb || 1;
        const position = Math.min(100, Math.max(0, best ? (best / elite) * 100 : 0));
        const level = best ? currentStandardLevel(best, standards) : "no data";
        return h("article", { key: liftId, class: "panel", style: "padding:12px" },
          h("div", { class: "chart-head" }, h("b", null, model.lift), h("span", { class: "muted" }, best ? `${Math.round(best)} lb / ${level}` : "no data")),
          h("div", { class: "standard-bar" }, h("span", { class: "standard-marker", style: `left:calc(${position}% - 2px)` })),
          h("p", { class: "muted" }, `${sex} / ${bracket} lb / age ${ageBracket}`)
        );
      });
    }

    function buildStrengthStandards() {
      const ageMultipliers = { "18-39": 1, "40-49": 0.92, "50-59": 0.82, "60-69": 0.7 };
      return Object.entries(strengthStandardModels).flatMap(([liftId, model]) =>
        ["male", "female"].flatMap((sex) =>
          bodyweightBrackets.flatMap((bodyweight) =>
            ageBrackets.flatMap((age) =>
              standardLevels.map((level, index) => ({
                lift_id: liftId,
                lift: model.lift,
                sex,
                bodyweight_bracket_lb: bodyweight,
                age_bracket: age,
                level,
                one_rm_lb: Math.round(bodyweight * model[sex][index] * ageMultipliers[age] / 5) * 5
              }))
            )
          )
        )
      );
    }

    function bestE1RMForModel(state, model) {
      const ids = new Set(model.aliases);
      return Math.max(0, ...state.sets.filter((set) => ids.has(set.exercise_id) || model.aliases.some((alias) => normalizeText(set.exercise).includes(normalizeText(alias)))).map(e1rm));
    }

    function currentStandardLevel(value, standards) {
      return standards.filter((row) => value >= row.one_rm_lb).slice(-1)[0]?.level || "below untrained";
    }

    function trendPoints(sets) {
      const byDate = new Map();
      sets.forEach((set) => {
        const value = e1rm(set);
        const previous = byDate.get(set.date);
        if (!previous || value > previous.e1rm) byDate.set(set.date, { date: set.date, time: new Date(`${set.date}T12:00:00`).getTime(), e1rm: value });
      });
      return [...byDate.values()].sort((a, b) => a.time - b.time);
    }

    function calculatePlates(weight) {
      const remaining = (Number(weight) - BAR_WEIGHT) / 2;
      if (!Number.isFinite(remaining) || remaining < 0) return { loadable: false, perSide: 0, plates: [] };
      let left = remaining;
      const plates = [];
      PLATES.forEach((plate) => {
        while (left + 0.001 >= plate) {
          plates.push(plate);
          left -= plate;
        }
      });
      return { loadable: true, perSide: remaining, plates, leftover: left };
    }

    function getProgram(state) {
      return state.programs.find((program) => program.id === state.activeProgramId) || state.programs[0];
    }

    function getDay(state) {
      const program = getProgram(state);
      return program?.days.find((day) => day.id === state.activeDayId) || program?.days[0];
    }

    function getDayById(state, dayId) {
      return state.programs.flatMap((program) => program.days).find((day) => day.id === dayId);
    }

    function getExercise(state, id) {
      return state.exercises.find((exercise) => exercise.id === id);
    }

    function setsForDate(state, date) {
      return state.sets.filter((set) => set.date === date).sort(sortRecords);
    }

    function setsForExercise(state, exerciseId) {
      return state.sets.filter((set) => set.exercise_id === exerciseId).sort(sortRecords);
    }

    function mostLoggedExercises(state) {
      return state.exercises.map((exercise) => ({ exercise, count: setsForExercise(state, exercise.id).length })).filter((item) => item.count).sort((a, b) => b.count - a.count).map((item) => item.exercise);
    }

    function lastWeightForExercise(state, exerciseId) {
      return setsForExercise(state, exerciseId).slice(-1)[0]?.weight_lb || "";
    }

    function volume(set) {
      return Number(set.weight_lb || 0) * Number(set.reps || 0);
    }

    function e1rm(set) {
      return Number(set.weight_lb || 0) * (1 + Number(set.reps || 0) / 30);
    }

    function csvRecordId(record) {
      return [record.date, normalizeText(record.exercise), record.set_number].join("|");
    }

    function mergeById(base, incoming) {
      return [...new Map([...base, ...incoming].map((item) => [item.id, item])).values()];
    }

    function cloneState(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function parseWeight(value) {
      const cleaned = String(value ?? "").replace(/[^0-9.]/g, "");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function roundToPlate(value) {
      return Math.max(BAR_WEIGHT, Math.round(value / 5) * 5);
    }

    function formatWeight(value) {
      const number = Number(value);
      return Number.isInteger(number) ? `${number}` : `${number.toFixed(1)}`;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat().format(Math.round(value || 0));
    }

    function formatTimer(seconds) {
      const mins = Math.floor(Number(seconds || 0) / 60);
      const secs = Math.floor(Number(seconds || 0) % 60);
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(Number(ms || 0) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours) return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function parseDurationInput(value) {
      const text = cleanValue(value).toLowerCase();
      if (!text) return NaN;
      if (/^\d+(\.\d+)?$/.test(text)) return Number(text) * 60000;
      const colon = text.match(/^(\d+):([0-5]?\d)(?::([0-5]?\d))?$/);
      if (colon) {
        const first = Number(colon[1]);
        const second = Number(colon[2]);
        const third = Number(colon[3] || 0);
        return colon[3] ? ((first * 3600) + (second * 60) + third) * 1000 : ((first * 60) + second) * 1000;
      }
      const hours = text.match(/(\d+(?:\.\d+)?)\s*h/);
      const minutes = text.match(/(\d+(?:\.\d+)?)\s*m/);
      const seconds = text.match(/(\d+(?:\.\d+)?)\s*s/);
      const total =
        (hours ? Number(hours[1]) * 3600000 : 0) +
        (minutes ? Number(minutes[1]) * 60000 : 0) +
        (seconds ? Number(seconds[1]) * 1000 : 0);
      return total || NaN;
    }

    function formatDateTime(value) {
      try {
        return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(value));
      } catch {
        return value;
      }
    }

    function sortRecords(a, b) {
      return String(a.date || "").localeCompare(String(b.date || "")) || Number(a.set_number || 0) - Number(b.set_number || 0) || String(a.created_at || "").localeCompare(String(b.created_at || ""));
    }

    function byOrder(a, b) {
      return Number(a.order || 0) - Number(b.order || 0);
    }

    function byName(a, b) {
      return a.name.localeCompare(b.name);
    }

    function shortDayLabel(index, label) {
      return ["M", "T", "W", "T", "F", "S", "S"][index] || label.slice(0, 1);
    }

    function ageToBracket(age) {
      if (age >= 60) return "60-69";
      if (age >= 50) return "50-59";
      if (age >= 40) return "40-49";
      return "18-39";
    }

    function nearest(values, target) {
      return values.slice().sort((a, b) => Math.abs(a - target) - Math.abs(b - target))[0];
    }

    function normalizeText(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    }

    function cleanValue(value) {
      return String(value ?? "").trim();
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function nowISO() {
      return new Date().toISOString();
    }

    function cryptoId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return `k3v-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function downloadText(text, name, type) {
      const blob = new Blob([text], { type: `${type};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = name;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function registerServiceWorker() {
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    }

    render(h(K3V_App), document.getElementById("root"));
  </script>
</body>
