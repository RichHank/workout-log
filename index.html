<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K3VSYNC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/preact@10.26.9/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10.26.9/hooks/dist/hooks.umd.js"></script>
  <title>K3VSYNC</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #202836;
      --text: #f5f8fc;
      --muted: #9ca9b8;
      --line: #2c3544;
      --line-strong: #3d4b5d;
      --accent: #8fb7ff;
      --green: #74e6ad;
      --gold: #ffd08a;
      --danger: #ff8a93;
      --shadow: 0 18px 44px rgba(0,0,0,0.28);
      --radius: 8px;
      --tap: 46px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(143,183,255,0.13), transparent 34rem),
        linear-gradient(180deg, #121620 0%, var(--bg) 58%);
      color: var(--text);
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    input, textarea, select {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #111722;
      color: var(--text);
      outline: none;
      padding: 10px 12px;
    }
    textarea { resize: vertical; min-height: 86px; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(143,183,255,0.16);
    }
    h1, h2, h3, p { margin-top: 0; }

    .app-shell {
      width: min(100%, 1040px);
      min-height: 100vh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 14px calc(108px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0 10px;
      background: rgba(14,17,22,0.92);
      backdrop-filter: blur(16px);
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent), var(--green));
      color: #08111f;
      font-weight: 950;
      box-shadow: var(--shadow);
    }
    .brand h1 { margin: 0; font-size: 1.06rem; line-height: 1.05; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 0.78rem; line-height: 1.2; }


    .sync-chip {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(23,28,36,0.86);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
      white-space: nowrap;
    }
    .sync-chip[data-state="syncing"] { color: var(--green); border-color: rgba(116,230,173,0.42); }
    .sync-dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
    .sync-chip[data-state="syncing"] .sync-dot { animation: pulse 1.1s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(116,230,173,0.45); }
      70% { box-shadow: 0 0 0 8px rgba(116,230,173,0); }
      100% { box-shadow: 0 0 0 0 rgba(116,230,173,0); }
    }

    .toolbar { display: grid; gap: 10px; margin: 6px 0 14px; }

    .segmented {
      display: grid;
      grid-template-columns: repeat(5, minmax(82px, 1fr));
      gap: 4px;
      padding: 4px;
      overflow-x: auto;
      border-radius: var(--radius);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }
    .segmented button, .day-strip button {
      min-height: 40px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }
    .segmented button[aria-selected="true"], .day-strip button[aria-current="true"] {
      background: var(--text);
      color: #0d121a;
    }

    .date-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

    .day-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(104px, 1fr);
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .day-strip button {
      display: grid;
      align-content: center;
      gap: 2px;
      min-height: 54px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .day-strip span {
      overflow: hidden;
      text-overflow: ellipsis;
      color: inherit;
      font-size: 0.72rem;
      opacity: 0.8;
      white-space: nowrap;
    }

    .primary-btn, .ghost-btn, .mini-btn {
      min-height: var(--tap);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius);
      font-weight: 900;
    }
    .primary-btn {
      padding: 0 14px;
      background: var(--accent);
      color: #08111f;
      box-shadow: 0 12px 26px rgba(143,183,255,0.18);
    }
    .ghost-btn {
      padding: 0 13px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .ghost-btn.danger, .mini-btn.danger { color: var(--danger); border-color: rgba(255,138,147,0.42); }
    .mini-btn {
      width: 42px; height: 42px;
      min-height: 42px;
      flex: 0 0 auto;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 0;
    }
    .mini-btn.primary { background: var(--text); color: #111722; border-color: var(--text); }

    .panel {
      background: rgba(23,28,36,0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
      margin: 16px 0 9px;
    }
    .section-title h2 { margin: 0; font-size: 1rem; line-height: 1.15; }
    .muted, .section-title span { color: var(--muted); font-size: 0.78rem; line-height: 1.3; }

    .actions, .form-grid, .row-actions { display: grid; gap: 8px; }
    .actions { grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); margin-bottom: 12px; }
    .form-grid { grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); }

    .session-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      min-height: 56px;
      background: rgba(23,28,36,0.62);
      border-color: rgba(44,53,68,0.78);
      box-shadow: none;
    }
    .session-strip.active { border-color: rgba(143,183,255,0.35); background: rgba(23,28,36,0.78); }
    .session-strip.paused { border-color: rgba(255,208,138,0.25); background: rgba(23,28,36,0.7); }
    .session-strip-main {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .session-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 950;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .session-label.paused-label { color: var(--gold); }
    .session-time {
      font-size: 1.35rem;
      font-weight: 950;
      color: var(--text);
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, 'SF Mono', monospace;
    }
    .session-time.paused-time { color: var(--gold); opacity: 0.7; }
    .session-meta { color: var(--muted); font-size: 0.75rem; }
    .session-controls { display: flex; gap: 5px; flex-shrink: 0; }
    .session-edit-btn, .session-finish-btn { min-height: 34px; padding: 0 10px; }
    .session-finish-btn {
      background: var(--green);
      color: #08111f;
      font-weight: 900;
      border-radius: var(--radius);
    }
    .session-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .session-head h2 { margin: 0; font-size: 1.12rem; }

    .voice-panel { padding: 12px; }
    .voice-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }
    .voice-grid textarea {
      min-height: 46px;
      height: 46px;
      max-height: 132px;
      padding-top: 11px;
    }

    .field label {
      display: block;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }
    .stack { display: grid; gap: 12px; }

    .exercise-card, .day-card, .chart-card, .drive-card { overflow: hidden; }
    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 13px 12px 10px;
      border-bottom: 1px solid var(--line);
    }
    .card-head h2 { margin: 0; font-size: 1rem; line-height: 1.18; }
    .chip-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1;
      background: #253142;
      color: #c7d7ea;
      white-space: nowrap;
    }
    .pill.green { background: #123427; color: #bdf3d0; }
    .pill.gold { background: #3a2913; color: #ffd79a; }

    .set-form {
      display: grid;
      grid-template-columns: minmax(112px, 1fr) 70px 70px minmax(96px, 1fr) auto;
      gap: 7px;
      padding: 10px 12px;
      align-items: end;
      border-bottom: 1px solid var(--line);
    }
    .weight-field { display: grid; grid-template-columns: 1fr 42px; gap: 6px; }

    .set-row, .exercise-row, .block-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 52px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .exercise-row, .block-row { grid-template-columns: minmax(0, 1fr) auto; }
    .set-row:last-child, .exercise-row:last-child, .block-row:last-child { border-bottom: 0; }

    .set-num {
      width: 32px; height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 950;
    }
    .row-main { min-width: 0; }
    .row-main b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-main span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.76rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty {
      padding: 16px 12px;
      color: var(--muted);
      text-align: center;
      font-size: 0.84rem;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }
    .chart-card { padding: 12px; }
    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .trend-svg { width: 100%; height: 190px; display: block; overflow: visible; }

    .standard-bar {
      position: relative;
      height: 10px;
      margin: 12px 0 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #435065, #8fb7ff, #74e6ad, #ffd08a);
    }
    .standard-marker {
      position: absolute;
      top: -5px;
      width: 4px;
      height: 20px;
      border-radius: 999px;
      background: var(--text);
      box-shadow: 0 0 0 2px #111722;
    }

    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(14,17,22,0.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .bottom-nav-inner {
      width: min(100%, 1040px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .bottom-nav button {
      min-height: 48px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
    }
    .bottom-nav button[aria-selected="true"] { background: var(--panel-2); color: var(--text); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: end center;
      padding: 18px;
      background: rgba(0,0,0,0.52);
    }
    .modal-panel {
      width: min(100%, 560px);
      max-height: min(88vh, 760px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .modal-head h2 { margin: 0; font-size: 1rem; }

    .toast {
      position: fixed;
      left: 14px; right: 14px;
      bottom: calc(78px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(calc(100% - 28px), 520px);
      margin: 0 auto;
      padding: 12px 13px;
      border-radius: var(--radius);
      background: var(--text);
      color: #10141b;
      font-weight: 850;
      box-shadow: var(--shadow);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .segmented { display: none; }
      .sync-chip { font-size: 0.65rem; padding: 0 7px; gap: 4px; }
      .sync-chip span:last-child { display: none; }
      .voice-grid { grid-template-columns: auto 1fr; }
      .voice-grid button:last-child { grid-column: 1 / -1; }
      .set-form { grid-template-columns: 1fr 70px 70px auto; }
      .notes-field { grid-column: 1 / -1; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { h, render } = preact;
    const { useEffect, useMemo, useRef, useState } = preactHooks;

    // --- Constants ---
    const STORAGE_KEY = "workout-log-v2";
    const DB_NAME = "workout-log-db";
    const DB_VERSION = 2;
    const DB_STORE = "keyval";
    const DRIVE_STATE_FILE = "workout-log-state.json";
    const GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
    const GOOGLE_OAUTH_CLIENT_ID = "565625887082-vfb55neduq0bj9trrcgonntckj44mt4d.apps.googleusercontent.com";
    const DRIVE_AUTO_SYNC_DELAY = 2600;
    const LOCAL_SAVE_DEBOUNCE = 80;
    const BAR_WEIGHT = 45;
    const PLATES = [45, 35, 25, 10, 5, 2.5];

    const muscles = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Quads", "Hamstrings", "Glutes", "Calves", "Core", "Cardio"];
    const patterns = ["squat", "hinge", "press", "pull", "carry", "lunge", "core", "cardio"];
    const dayTypes = ["Strength", "Cardio", "Mobility", "Rest", "Custom"];
    const standardLevels = ["untrained", "novice", "intermediate", "advanced", "elite"];
    const bodyweightBrackets = [120, 150, 180, 210, 240, 270];
    const ageBrackets = ["18-39", "40-49", "50-59", "60-69"];
    const strengthStandardModels = {
      "bench-press": { lift: "Bench Press", aliases: ["bench-press"], male: [0.65, 0.92, 1.23, 1.58, 1.95], female: [0.38, 0.55, 0.75, 0.95, 1.15] },
      squat: { lift: "Squat", aliases: ["front-squat", "leg-press"], male: [0.85, 1.2, 1.55, 1.95, 2.45], female: [0.55, 0.8, 1.05, 1.35, 1.65] },
      deadlift: { lift: "Deadlift", aliases: ["deadlift", "romanian-deadlift"], male: [1.0, 1.35, 1.75, 2.25, 2.75], female: [0.7, 1.0, 1.35, 1.7, 2.05] },
      "overhead-press": { lift: "Overhead Press", aliases: ["overhead-press"], male: [0.38, 0.55, 0.72, 0.95, 1.12], female: [0.24, 0.35, 0.48, 0.62, 0.78] },
      "barbell-row": { lift: "Barbell Row", aliases: ["seated-cable-row", "wide-cable-row"], male: [0.62, 0.88, 1.15, 1.45, 1.75], female: [0.42, 0.6, 0.82, 1.02, 1.22] },
      "pull-up": { lift: "Pull-up", aliases: ["lat-pulldown-close", "lat-pulldown-wide"], male: [0.45, 0.65, 0.9, 1.12, 1.35], female: [0.28, 0.42, 0.58, 0.74, 0.9] }
    };

    function ex(id, name, primary, pattern, rest, sets, reps, aliases = []) {
      return {
        id, name,
        primary_muscle: primary,
        movement_pattern: pattern,
        default_rest_seconds: rest,
        default_sets: sets,
        default_rep_range: reps,
        demo_video_url: "",
        notes: "",
        aliases,
        updated_at: new Date(0).toISOString()
      };
    }

    const defaultExercises = [
      ex("bench-press", "Bench Press", "Chest", "press", 180, 3, "4-6", ["bench", "barbell bench"]),
      ex("incline-db-press", "Incline DB Press", "Chest", "press", 150, 2, "6-10", ["incline press", "incline dumbbell press"]),
      ex("lat-pulldown-close", "Lat Pulldown, Close Neutral", "Back", "pull", 120, 2, "8-10", ["close lat pulldown", "neutral pulldown", "lat pulldown"]),
      ex("seated-cable-row", "Seated Cable Row", "Back", "pull", 120, 2, "10-12", ["seated row", "cable row"]),
      ex("barbell-curl", "Barbell Curl", "Biceps", "pull", 90, 2, "8-10", ["curl"]),
      ex("hammer-curl", "Hammer Curl", "Biceps", "pull", 75, 1, "10-15", ["hammer curls"]),
      ex("front-squat", "Front Squat", "Quads", "squat", 180, 2, "4-6", ["front squats"]),
      ex("leg-press", "Leg Press", "Quads", "squat", 150, 2, "8-12", []),
      ex("leg-extension", "Leg Extension", "Quads", "squat", 75, 2, "10-15", ["leg extensions"]),
      ex("romanian-deadlift", "Romanian Deadlift", "Hamstrings", "hinge", 180, 2, "8-10", ["rdl"]),
      ex("leg-curl", "Leg Curl", "Hamstrings", "hinge", 75, 2, "10-15", ["leg curls"]),
      ex("standing-calf-raise", "Standing Calf Raise", "Calves", "carry", 60, 3, "12-15", ["calf raise", "standing calves"]),
      ex("overhead-press", "Overhead Press", "Shoulders", "press", 180, 2, "4-6", ["ohp", "shoulder press"]),
      ex("lateral-raise", "Lateral Raise", "Shoulders", "press", 60, 2, "12-15", ["side raise", "lateral raises"]),
      ex("lat-pulldown-wide", "Lat Pulldown, Wide", "Back", "pull", 120, 2, "8-10", ["wide pulldown", "wide lat pulldown"]),
      ex("wide-cable-row", "Cable Row, Wide", "Back", "pull", 120, 2, "10-12", ["wide row"]),
      ex("tricep-pushdown", "Tricep Pushdown", "Triceps", "press", 75, 2, "10-15", ["pushdown", "triceps pushdown"]),
      ex("overhead-tricep-extension", "Overhead Tricep Extension", "Triceps", "press", 75, 1, "10-15", ["overhead extension", "triceps extension"]),
      ex("deadlift", "Deadlift", "Hamstrings", "hinge", 240, 2, "4-6", ["deadlifts"]),
      ex("bulgarian-split-squat", "Bulgarian Split Squat", "Quads", "lunge", 120, 2, "8-10", ["bulgarian", "split squat"]),
      ex("hip-thrust", "Hip Thrust", "Glutes", "hinge", 150, 2, "10-12", ["hip thrusts"])
    ];

    // Strength standards table is deterministic from the static models -- compute once at load.
    const STRENGTH_STANDARDS = (() => {
      const ageMultipliers = { "18-39": 1, "40-49": 0.92, "50-59": 0.82, "60-69": 0.7 };
      const out = [];
      for (const [liftId, model] of Object.entries(strengthStandardModels)) {
        for (const sex of ["male", "female"]) {
          for (const bw of bodyweightBrackets) {
            for (const age of ageBrackets) {
              standardLevels.forEach((level, index) => {
                out.push({
                  lift_id: liftId,
                  lift: model.lift,
                  sex,
                  bodyweight_bracket_lb: bw,
                  age_bracket: age,
                  level,
                  one_rm_lb: Math.round(bw * model[sex][index] * ageMultipliers[age] / 5) * 5
                });
              });
            }
          }
        }
      }
      return out;
    })();

    // --- Pure utility helpers ---
    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function nowISO() { return new Date().toISOString(); }
    function cryptoId() { return crypto.randomUUID(); }
    function cleanValue(v) { return String(v ?? "").trim(); }
    function normalizeText(v) { return String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
    function cloneState(value) { return structuredClone(value); }
    function bump(target, patch = {}) { Object.assign(target, patch, { updated_at: nowISO() }); return target; }

    function parseWeight(value) {
      const cleaned = String(value ?? "").replace(/[^0-9.]/g, "");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : NaN;
    }
    function roundToPlate(value) { return Math.max(BAR_WEIGHT, Math.round(value / 5) * 5); }
    function formatWeight(value) {
      const n = Number(value);
      return Number.isInteger(n) ? `${n}` : `${n.toFixed(1)}`;
    }
    function formatNumber(value) { return new Intl.NumberFormat().format(Math.round(value || 0)); }

    function _hms(totalSeconds) {
      const t = Math.max(0, Math.floor(totalSeconds || 0));
      return [Math.floor(t / 3600), Math.floor((t % 3600) / 60), t % 60];
    }
    function formatRest(seconds) {
      const [h, m, s] = _hms(seconds);
      return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
    }
    function formatDuration(ms) {
      const [h, m, s] = _hms((ms || 0) / 1000);
      return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    function parseDurationInput(value) {
      const text = cleanValue(value).toLowerCase();
      if (!text) return NaN;
      if (/^\d+(\.\d+)?$/.test(text)) return Number(text) * 60000;
      const colon = text.match(/^(\d+):([0-5]?\d)(?::([0-5]?\d))?$/);
      if (colon) {
        const a = Number(colon[1]), b = Number(colon[2]), c = Number(colon[3] || 0);
        return colon[3] ? ((a * 3600) + (b * 60) + c) * 1000 : ((a * 60) + b) * 1000;
      }
      const hM = text.match(/(\d+(?:\.\d+)?)\s*h/);
      const mM = text.match(/(\d+(?:\.\d+)?)\s*m/);
      const sM = text.match(/(\d+(?:\.\d+)?)\s*s/);
      const total = (hM ? Number(hM[1]) * 3600000 : 0) + (mM ? Number(mM[1]) * 60000 : 0) + (sM ? Number(sM[1]) * 1000 : 0);
      return total || NaN;
    }
    function formatDateTime(value) {
      try { return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(value)); }
      catch { return value; }
    }
    function nearest(values, target) {
      return values.slice().sort((a, b) => Math.abs(a - target) - Math.abs(b - target))[0];
    }
    function ageToBracket(age) {
      if (age >= 60) return "60-69";
      if (age >= 50) return "50-59";
      if (age >= 40) return "40-49";
      return "18-39";
    }
    function shortDayLabel(index, label) {
      return ["M", "T", "W", "T", "F", "S", "S"][index] || (label || "?").slice(0, 1);
    }
    function sortRecords(a, b) {
      return String(a.date || "").localeCompare(String(b.date || ""))
        || Number(a.set_number || 0) - Number(b.set_number || 0)
        || String(a.created_at || "").localeCompare(String(b.created_at || ""));
    }
    function byOrder(a, b) { return Number(a.order || 0) - Number(b.order || 0); }
    function byName(a, b) { return a.name.localeCompare(b.name); }
    function newer(a, b) { return String(a?.updated_at || a?.created_at || "") >= String(b?.updated_at || b?.created_at || ""); }
    function mergeById(base, incoming) {
      return [...new Map([...base, ...incoming].map((item) => [item.id, item])).values()];
    }
    function csvRecordId(record) { return [record.date, normalizeText(record.exercise), record.set_number].join("|"); }

    function downloadText(text, name, type) {
      const blob = new Blob([text], { type: `${type};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function registerServiceWorker() {
      // Disabled for this single-file build. A stale PWA/service-worker cache can keep serving
      // an older broken timer even after index.html is replaced. Also unregister any old worker.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations?.()
          .then((regs) => regs.forEach((reg) => reg.unregister()))
          .catch(() => {});
      }
    }

    // --- Set/session derived values ---
    function volume(set) { return Number(set.weight_lb || 0) * Number(set.reps || 0); }
    function e1rm(set) { return Number(set.weight_lb || 0) * (1 + Number(set.reps || 0) / 30); }

    // --- Default state factories ---
    function defaultDriveSettings() {
      return { provider: "google-drive", clientId: "", fileName: DRIVE_STATE_FILE, fileId: "", connectedAt: "", lastSyncAt: "", lastStatus: "", autoSync: true };
    }

    function blockFromExercise(exercise, order = 0) {
      return {
        id: cryptoId(),
        exercise_id: exercise.id,
        sets: exercise.default_sets || 3,
        rep_range: exercise.default_rep_range || "8-12",
        rest_seconds: exercise.default_rest_seconds || 120,
        order,
        updated_at: nowISO()
      };
    }

    function createProgramFromTemplate(name, split, daysPerWeek, exercises) {
      const map = Object.fromEntries(exercises.map((item) => [item.id, item]));
      const templates = {
        "Upper/Lower": [
          ["Upper A", ["bench-press", "incline-db-press", "lat-pulldown-close", "seated-cable-row", "barbell-curl", "hammer-curl"]],
          ["Lower A", ["front-squat", "leg-press", "leg-extension", "romanian-deadlift", "leg-curl", "standing-calf-raise"]],
          ["Upper B", ["overhead-press", "lateral-raise", "lat-pulldown-wide", "wide-cable-row", "tricep-pushdown", "overhead-tricep-extension"]],
          ["Lower B", ["deadlift", "bulgarian-split-squat", "hip-thrust", "leg-curl", "leg-extension", "standing-calf-raise"]]
        ],
        "Push/Pull/Legs": [
          ["Push", ["bench-press", "incline-db-press", "overhead-press", "lateral-raise", "tricep-pushdown"]],
          ["Pull", ["deadlift", "lat-pulldown-wide", "seated-cable-row", "barbell-curl", "hammer-curl"]],
          ["Legs", ["front-squat", "leg-press", "romanian-deadlift", "leg-curl", "standing-calf-raise"]]
        ],
        "Full Body": [
          ["Full A", ["front-squat", "bench-press", "seated-cable-row", "leg-curl"]],
          ["Full B", ["deadlift", "overhead-press", "lat-pulldown-wide", "leg-extension"]],
          ["Full C", ["leg-press", "incline-db-press", "wide-cable-row", "standing-calf-raise"]]
        ]
      };
      const source = templates[split] || templates["Upper/Lower"];
      const days = Array.from({ length: daysPerWeek }, (_, index) => {
        const template = source[index % source.length] || [`Day ${index + 1}`, []];
        return {
          id: cryptoId(),
          label: template[0],
          type: "Strength",
          order: index,
          blocks: template[1].filter((id) => map[id]).map((id, i) => blockFromExercise(map[id], i))
        };
      });
      return { id: cryptoId(), name, split, days, created_at: nowISO(), updated_at: nowISO() };
    }

    function createDefaultState() {
      const exercises = defaultExercises.map((item) => ({ ...item }));
      const programs = [createProgramFromTemplate("Upper/Lower", "Upper/Lower", 4, exercises)];
      return {
        schema_version: 3,
        view: "log",
        activeDate: todayISO(),
        activeProgramId: programs[0].id,
        activeDayId: programs[0].days[0].id,
        editPlan: false,
        exercises,
        programs,
        sessions: [],
        sets: [],
        drafts: {},
        command: "",
        profile: { sex: "male", bodyweight_lb: "", age: "", height: "" },
        settings: { drive: defaultDriveSettings() },
        csvPreview: null
      };
    }

    function createExercise(overrides = {}) {
      const restNum = Number(overrides.default_rest_seconds);
      const setsNum = Number(overrides.default_sets);
      return {
        id: cryptoId(),
        name: overrides.name || "New Exercise",
        primary_muscle: overrides.primary_muscle || "Chest",
        movement_pattern: overrides.movement_pattern || "press",
        default_rest_seconds: Number.isFinite(restNum) ? restNum : 120,
        default_sets: Number.isFinite(setsNum) ? setsNum : 3,
        default_rep_range: overrides.default_rep_range || "8-12",
        demo_video_url: overrides.demo_video_url || "",
        notes: overrides.notes || "",
        aliases: overrides.aliases || [],
        updated_at: nowISO()
      };
    }

    function normalizeState(saved) {
      const fallback = createDefaultState();
      if (!saved || typeof saved !== "object") return fallback;
      if (saved.schema_version !== 2 && saved.schema_version !== 3) return fallback;
      const merged = { ...fallback, ...saved, schema_version: 3 };
      merged.exercises = mergeById(fallback.exercises, saved.exercises || []);
      merged.programs = saved.programs?.length ? saved.programs : fallback.programs;
      merged.sessions = (saved.sessions || []).map((session) => ({
        paused_total_ms: 0, manual_duration_ms: null, notes: "",
        rest_started_at: null, rest_duration_ms: 0, rest_paused_at: null, rest_paused_total_ms: 0,
        rest_label: "", rest_completed_at: null,
        ...session
      }));
      merged.sets = saved.sets || [];
      merged.drafts = saved.drafts || {};
      merged.command = saved.command || "";
      merged.profile = { ...fallback.profile, ...(saved.profile || {}) };
      merged.settings = {
        ...fallback.settings, ...(saved.settings || {}),
        drive: { ...defaultDriveSettings(), ...(saved.settings?.drive || {}) }
      };
      merged.view = ["log", "progress", "plan", "exercises", "sync"].includes(saved.view) ? saved.view : "log";
      if (!merged.activeProgramId || !getProgram(merged)) merged.activeProgramId = merged.programs[0]?.id;
      if (!merged.activeDayId || !getDay(merged)) merged.activeDayId = getProgram(merged)?.days[0]?.id;
      return merged;
    }

    // --- Storage layer (debounced local writes) ---
    const K3V_Storage = {
      _saveTimer: null,
      _pending: null,
      async load() {
        // Clean up orphan key from older builds
        try { localStorage.removeItem("session_start_time"); } catch {}
        const saved = await this._read();
        return normalizeState(saved);
      },
      async _read() {
        try {
          const v = await this.idbGet(STORAGE_KEY);
          if (v) return v;
        } catch {}
        try {
          const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (v) return v;
        } catch {}
        return null;
      },
      save(state) {
        this._pending = state;
        if (this._saveTimer) clearTimeout(this._saveTimer);
        this._saveTimer = setTimeout(() => this._flush(), LOCAL_SAVE_DEBOUNCE);
      },
      saveImmediate(state) {
        this._pending = state;
        if (this._saveTimer) { clearTimeout(this._saveTimer); this._saveTimer = null; }
        this._flush();
      },
      _flush() {
        const state = this._pending;
        this._pending = null;
        if (!state) return;
        const snapshot = structuredClone({ ...state, csvPreview: null });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch {}
        this.idbSet(STORAGE_KEY, snapshot).catch(() => {});
      },
      openDB() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) return reject(new Error("IndexedDB unavailable"));
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async idbGet(key) {
        const db = await this.openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const req = tx.objectStore(DB_STORE).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
          tx.oncomplete = () => db.close();
        });
      },
      async idbSet(key, value) {
        const db = await this.openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readwrite");
          tx.objectStore(DB_STORE).put(value, key);
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => reject(tx.error);
        });
      }
    };

    // --- Drive sync engine ---
    const K3V_SyncEngine = (() => {
      let googleAccessToken = "";
      let googleTokenClient = null;
      let syncTimer = null;
      let inFlight = false;
      let dirty = false;

      function clientId(state) {
        return GOOGLE_OAUTH_CLIENT_ID || cleanValue(state.settings?.drive?.clientId || "");
      }
      function canSync(state) {
        return Boolean(clientId(state)) && Boolean(googleAccessToken)
          && state.settings?.drive?.autoSync !== false && navigator.onLine !== false;
      }

      function schedule(state, callbacks, delay = DRIVE_AUTO_SYNC_DELAY) {
        if (!canSync(state)) return;
        dirty = true;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => run(state, callbacks, { silent: true }), delay);
      }

      async function connect(state, callbacks) {
        await ensureGoogleDriveToken(state, true);
        const next = cloneState(state);
        next.settings.drive.connectedAt = nowISO();
        next.settings.drive.autoSync = true;
        next.settings.drive.lastStatus = "Google Drive connected. K3VSYNC is syncing now.";
        callbacks.onState(next, { localOnly: true });
        return run(next, callbacks, { silent: false });
      }

      async function run(state, callbacks, options = {}) {
        if (inFlight) { dirty = true; return state; }
        inFlight = true;
        dirty = false;
        clearTimeout(syncTimer);
        callbacks.onStatus({ state: "syncing", label: "Syncing..." });
        let working = cloneState(state);
        try {
          await ensureGoogleDriveToken(working, false);
          const remote = await pullDriveState(working);
          if (remote) working = deepUnionMerge(working, remote);
          await pushDriveState(working);
          working.settings.drive.lastSyncAt = nowISO();
          working.settings.drive.lastStatus = "K3VSYNC deep-union sync complete.";
          callbacks.onState(working, { localOnly: true });
          callbacks.onStatus({ state: "synced", label: "Synced" });
          if (!options.silent) callbacks.onToast("Google Drive synced.");
        } catch (error) {
          working.settings.drive.lastStatus = `Google Drive sync failed: ${error.message}`;
          callbacks.onState(working, { localOnly: true });
          callbacks.onStatus({ state: "error", label: "Sync issue" });
          if (!options.silent) callbacks.onToast(error.message);
          throw error;
        } finally {
          inFlight = false;
          if (dirty) { dirty = false; schedule(working, callbacks, 400); }
        }
        return working;
      }

      function ensureGoogleDriveToken(state, forcePrompt = false) {
        return new Promise((resolve, reject) => {
          const id = clientId(state);
          if (!id) return reject(new Error("Google OAuth client is missing."));
          if (googleAccessToken && !forcePrompt) return resolve(googleAccessToken);
          if (!window.google?.accounts?.oauth2) return reject(new Error("Google Identity Services is still loading."));
          googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: id,
            scope: GOOGLE_DRIVE_SCOPE,
            callback: (response) => {
              if (response.error) return reject(new Error(response.error_description || response.error));
              googleAccessToken = response.access_token;
              resolve(googleAccessToken);
            }
          });
          googleTokenClient.requestAccessToken({ prompt: forcePrompt ? "consent" : "" });
        });
      }

      async function pullDriveState(state) {
        const file = await findDriveStateFile(state);
        if (!file) return null;
        const response = await googleDriveRequest(state, `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`);
        const parsed = JSON.parse(await response.text());
        const remote = normalizeState(parsed.state || parsed);
        remote.settings.drive.fileId = file.id;
        return remote;
      }

      async function pushDriveState(state) {
        const file = await findDriveStateFile(state);
        const content = backupPayload(state);
        if (file) {
          await googleDriveRequest(state,
            `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media&fields=id,name,modifiedTime`,
            { method: "PATCH", headers: { "Content-Type": "application/json" }, body: content }
          );
          state.settings.drive.fileId = file.id;
          return;
        }
        const created = await createDriveStateFile(state, content);
        state.settings.drive.fileId = created.id;
      }

      async function findDriveStateFile(state) {
        const fileName = state.settings.drive?.fileName || DRIVE_STATE_FILE;
        const q = encodeURIComponent(`name='${fileName.replace(/'/g, "\\'")}'`);
        const response = await googleDriveRequest(state,
          `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&pageSize=1&fields=files(id,name,modifiedTime)`
        );
        const data = await response.json();
        return data.files?.[0] || null;
      }

      async function createDriveStateFile(state, content) {
        const boundary = `k3vsync-${Date.now()}`;
        const metadata = {
          name: state.settings.drive?.fileName || DRIVE_STATE_FILE,
          parents: ["appDataFolder"],
          mimeType: "application/json"
        };
        const body = [
          `--${boundary}`, "Content-Type: application/json; charset=UTF-8", "",
          JSON.stringify(metadata),
          `--${boundary}`, "Content-Type: application/json", "",
          content,
          `--${boundary}--`
        ].join("\r\n");
        const response = await googleDriveRequest(state,
          "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime",
          { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body }
        );
        return response.json();
      }

      async function googleDriveRequest(state, url, options = {}) {
        const token = await ensureGoogleDriveToken(state, false);
        const response = await fetch(url, {
          ...options,
          headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
        });
        if (response.status === 401) {
          googleAccessToken = "";
          throw new Error("Google session expired. Sign in again.");
        }
        if (!response.ok) {
          let msg;
          try { msg = (await response.json()).error?.message; } catch {}
          throw new Error(msg || `Google Drive request failed (${response.status})`);
        }
        return response;
      }

      function deepUnionMerge(local, remote) {
        const merged = normalizeState({
          ...local,
          exercises: mergeRecords(local.exercises, remote.exercises),
          sessions: mergeRecords(local.sessions, remote.sessions),
          sets: mergeRecords(local.sets, remote.sets),
          programs: mergePrograms(local.programs, remote.programs),
          profile: mergeProfile(local.profile, remote.profile),
          settings: { ...local.settings, drive: local.settings.drive }
        });
        if (remote.settings?.drive?.fileId) merged.settings.drive.fileId = remote.settings.drive.fileId;
        return merged;
      }

      function mergeRecords(local = [], remote = []) {
        const map = new Map();
        [...local, ...remote].forEach((item) => {
          if (!item?.id) return;
          const prev = map.get(item.id);
          if (!prev || newer(item, prev)) map.set(item.id, { ...prev, ...item });
        });
        return [...map.values()];
      }

      function mergePrograms(local = [], remote = []) {
        const map = new Map();
        [...local, ...remote].forEach((program) => {
          if (!program?.id) return;
          const prev = map.get(program.id);
          if (!prev) { map.set(program.id, cloneState(program)); return; }
          const base = newer(program, prev) ? { ...prev, ...program } : { ...program, ...prev };
          base.days = mergeDays(prev.days || [], program.days || []);
          map.set(program.id, base);
        });
        return [...map.values()];
      }

      function mergeDays(local = [], remote = []) {
        const map = new Map();
        [...local, ...remote].forEach((day) => {
          if (!day?.id) return;
          const prev = map.get(day.id);
          if (!prev) { map.set(day.id, cloneState(day)); return; }
          const base = newer(day, prev) ? { ...prev, ...day } : { ...day, ...prev };
          base.blocks = mergeRecords(prev.blocks || [], day.blocks || []).sort(byOrder);
          map.set(day.id, base);
        });
        return [...map.values()].sort(byOrder);
      }

      // Profile is a single record -- compare timestamps so the latest device wins.
      function mergeProfile(local = {}, remote = {}) {
        if (newer(local, remote)) return { ...remote, ...local };
        return { ...local, ...remote };
      }

      return { schedule, connect, run, deepUnionMerge, isConnected: () => Boolean(googleAccessToken) };
    })();

    // --- State queries (no mutation) ---
    function getProgram(state) {
      return state.programs.find((p) => p.id === state.activeProgramId) || state.programs[0];
    }
    function getDay(state) {
      const program = getProgram(state);
      return program?.days.find((d) => d.id === state.activeDayId) || program?.days[0];
    }
    function getDayById(state, dayId) {
      return state.programs.flatMap((p) => p.days).find((d) => d.id === dayId);
    }
    function getExercise(state, id) {
      return state.exercises.find((e) => e.id === id);
    }
    function setsForDate(state, date) {
      return state.sets.filter((s) => s.date === date).sort(sortRecords);
    }
    function setsForExercise(state, exerciseId) {
      return state.sets.filter((s) => s.exercise_id === exerciseId).sort(sortRecords);
    }
    function mostLoggedExercises(state) {
      return state.exercises
        .map((exercise) => ({ exercise, count: setsForExercise(state, exercise.id).length }))
        .filter((item) => item.count)
        .sort((a, b) => b.count - a.count)
        .map((item) => item.exercise);
    }
    function lastWeightForExercise(state, exerciseId) {
      return setsForExercise(state, exerciseId).slice(-1)[0]?.weight_lb || "";
    }
    function sessionForActiveDate(state) {
      return state.sessions.find((s) => s.date === state.activeDate && s.day_id === state.activeDayId);
    }
    function sessionElapsedMs(session, clock = Date.now()) {
      if (!session) return 0;

      const manual = Number(session.manual_duration_ms);
      if (Number.isFinite(manual)) {
        if (session.finished_at) return Math.max(0, manual);
        const anchor = new Date(session.manual_duration_set_at || session.updated_at || session.session_start || session.started_at || session.created_at || nowISO()).getTime();
        const end = session.paused_at ? new Date(session.paused_at).getTime() : clock;
        return Math.max(0, manual + Math.max(0, end - anchor));
      }

      const started = new Date(session.session_start || session.started_at || session.created_at || nowISO()).getTime();
      const paused = Number(session.paused_total_ms || 0);
      let elapsed = clock - started - paused;
      if (session.paused_at) {
        const pausedStart = new Date(session.paused_at).getTime();
        elapsed = pausedStart - started - paused;
      }
      return Math.max(0, elapsed);
    }


    // --- State mutations ---
    function activeSession(state) {
      let session = sessionForActiveDate(state);
      if (!session) {
        const now = nowISO();
        session = {
          id: cryptoId(),
          date: state.activeDate,
          program_id: state.activeProgramId,
          day_id: state.activeDayId,
          session_start: now,
          started_at: now,
          updated_at: now,
          paused_total_ms: 0,
          paused_at: null,
          manual_duration_ms: null,
          manual_duration_set_at: null,
          notes: "",
          rest_started_at: null,
          rest_duration_ms: 0,
          rest_paused_at: null,
          rest_paused_total_ms: 0,
          rest_label: "",
          rest_completed_at: null
        };
        state.sessions.push(session);
      }
      return session;
    }

    function pauseSession(state) {
      const session = activeSession(state);
      if (!session.paused_at) bump(session, { paused_at: nowISO() });
    }

    function resumeSession(state) {
      const session = activeSession(state);
      if (!session.paused_at) return;
      const pausedStart = new Date(session.paused_at).getTime();
      session.paused_total_ms = (session.paused_total_ms || 0) + (Date.now() - pausedStart);
      bump(session, { paused_at: null });
    }






    function adjustSessionDuration(updateState, deltaMs) {
      updateState((draft) => {
        const session = activeSession(draft);
        bump(session, { manual_duration_ms: Math.max(0, sessionElapsedMs(session) + deltaMs), manual_duration_set_at: nowISO() });
        draft.sessionTimeDraft = "";
      });
    }

    function appendSet(state, block, weight, reps, rpe = "", notes = "") {
      const exercise = getExercise(state, block.exercise_id);
      const session = activeSession(state);
      const existing = state.sets.filter((s) => s.session_id === session.id && s.exercise_id === block.exercise_id);
      const now = nowISO();
      state.sets.push({
        id: cryptoId(),
        session_id: session.id,
        date: state.activeDate,
        exercise_id: block.exercise_id,
        exercise: exercise?.name || "Exercise",
        set_number: existing.length + 1,
        reps,
        weight_lb: weight,
        rpe,
        notes,
        time_logged: new Date().toTimeString().slice(0, 8),
        session_elapsed_ms: sessionElapsedMs(session),
        created_at: now,
        updated_at: now
      });
      bump(session);
    }

    function renumberSets(state, sessionId, exerciseId) {
      state.sets
        .filter((s) => s.session_id === sessionId && s.exercise_id === exerciseId)
        .sort(sortRecords)
        .forEach((s, i) => bump(s, { set_number: i + 1 }));
    }

    function deleteExercise(id, updateState, showToast) {
      updateState((draft) => {
        const used = draft.programs.some((p) => p.days.some((d) => d.blocks.some((b) => b.exercise_id === id)));
        if (used) { showToast("Exercise is used in a plan. Remove the block first."); return draft; }
        draft.exercises = draft.exercises.filter((e) => e.id !== id);
      });
    }

    function createNewPlan(updateState, showToast) {
      updateState((draft) => {
        const plan = createProgramFromTemplate(`K3V Plan ${draft.programs.length + 1}`, "Upper/Lower", 4, draft.exercises);
        draft.programs.push(plan);
        draft.activeProgramId = plan.id;
        draft.activeDayId = plan.days[0]?.id;
      });
      showToast("Plan created.");
    }

    // --- Set add helpers ---
    function addSet(state, block, updateState, showToast) {
      const draft = state.drafts[block.id] || {};
      const reps = Number(draft.reps);
      const weight = parseWeight(draft.weight_lb);
      if (!Number.isFinite(reps) || reps <= 0 || !Number.isFinite(weight)) {
        showToast("Weight and reps are needed.");
        return;
      }
      updateState((next) => {
        appendSet(next, block, weight, reps, draft.rpe || "", draft.notes || "");
        next.drafts[block.id] = { weight_lb: String(weight), reps: "", rpe: draft.rpe || "", notes: "" };
      });
      showToast(`${getExercise(state, block.exercise_id)?.name || "Set"}: ${weight} x ${reps}`);
    }

    function addWarmups(state, block, updateState, showToast) {
      const draft = state.drafts[block.id] || {};
      const target = parseWeight(draft.weight_lb) || lastWeightForExercise(state, block.exercise_id) || BAR_WEIGHT;
      const warmups = [[0.5, 5], [0.7, 3], [0.85, 1]].map(([percent, reps]) => [
        roundToPlate(target * percent), reps, `${Math.round(percent * 100)}% warm-up`
      ]);
      updateState((next) => {
        warmups.forEach(([weight, reps, notes]) => appendSet(next, block, weight, reps, "", notes));
      });
      showToast("Warm-up sets added.");
    }

    // --- Voice ---
    function toggleVoice(state, updateState, showToast, listening, setListening, recognitionRef) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast("Voice entry is not available in this browser."); return; }
      if (listening && recognitionRef.current) { recognitionRef.current.stop(); return; }
      const recognition = new SR();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onstart = () => setListening(true);
      recognition.onend = () => { setListening(false); recognitionRef.current = null; };
      recognition.onerror = () => { setListening(false); showToast("Voice entry stopped."); };
      recognition.onresult = (event) => {
        const text = Array.from(event.results).map((r) => r[0]?.transcript || "").join(" ").trim();
        updateState((draft) => { draft.command = text; }, { localOnly: true });
        const final = Array.from(event.results).some((r) => r.isFinal);
        if (final) {
          const next = cloneState(state);
          next.command = text;
          showToast(parseVoiceCommand(next, updateState).message);
        }
      };
      recognitionRef.current = recognition;
      recognition.start();
    }

    function parseVoiceCommand(state, updateState) {
      const raw = cleanValue(state.command);
      if (!raw) return { ok: false, message: "No command text." };
      const match = findExerciseMatch(state, raw);
      if (!match) return { ok: false, message: "No matching exercise." };
      const sets = extractSets(raw, match.alias);
      if (!sets.length) return { ok: false, message: "No weight and reps found." };
      updateState((draft) => {
        let day = getDay(draft);
        let block = day.blocks.find((item) => item.exercise_id === match.exercise.id);
        if (!block) {
          block = blockFromExercise(match.exercise, day.blocks.length);
          day.blocks.push(block);
          bump(day);
        }
        sets.forEach((item) => appendSet(draft, block, Number(item.weight_lb), Number(item.reps), item.rpe || "", item.notes || ""));
        draft.command = "";
      });
      return { ok: true, message: `${sets.length} set${sets.length === 1 ? "" : "s"} added.` };
    }

    function findExerciseMatch(state, text) {
      const normalized = normalizeText(text);
      const matches = [];
      state.exercises.forEach((exercise) => {
        [exercise.name, ...(exercise.aliases || [])].map(normalizeText).forEach((alias) => {
          if (alias && normalized.includes(alias)) matches.push({ exercise, alias, score: alias.length });
        });
      });
      matches.sort((a, b) => b.score - a.score);
      return matches[0] || null;
    }

    function extractSets(text, alias) {
      let body = normalizeText(text)
        .replace(alias, " ")
        .replace(/\b(add|set|sets|logged|log|did|pounds|pound|lbs|lb|reps|rep)\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      const rpeMatch = body.match(/\b(?:rpe|r p e)\s*(\d+(?:\.\d+)?)\b/);
      const rpe = rpeMatch ? rpeMatch[1] : "";
      if (rpeMatch) body = body.replace(rpeMatch[0], " ");
      const notesMatch = body.match(/\bnote\s+(.+)$/);
      const notes = notesMatch ? notesMatch[1].trim() : "";
      if (notesMatch) body = body.replace(notesMatch[0], " ");
      const sets = [];
      const pairPattern = /(\d+(?:\.\d+)?)\s*(?:x|by|for|with)\s*(\d{1,3})/g;
      let match;
      while ((match = pairPattern.exec(body))) sets.push({ weight_lb: match[1], reps: match[2], rpe, notes });
      if (sets.length) return sets;
      const numbers = body.match(/\d+(?:\.\d+)?/g) || [];
      for (let i = 0; i < numbers.length - 1; i += 2) {
        sets.push({ weight_lb: numbers[i], reps: numbers[i + 1], rpe, notes });
      }
      return sets;
    }

    // --- CSV import/export (RFC 4180 quoted) ---
    function csvCell(value) {
      const s = String(value ?? "");
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function toCSV(sets) {
      const headers = ["date", "exercise", "set_number", "reps", "weight_lb", "rpe", "notes", "time_logged"];
      const rows = sets.slice().sort(sortRecords).map((s) => [s.date, s.exercise, s.set_number, s.reps, s.weight_lb, s.rpe, s.notes, s.time_logged]);
      return [headers, ...rows].map((row) => row.map(csvCell).join(",")).join("\n");
    }

    function parseCSVRows(text) {
      const rows = [];
      let row = [], cur = "", inQuote = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuote) {
          if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') inQuote = false;
          else cur += c;
        } else if (c === '"') inQuote = true;
        else if (c === ",") { row.push(cur); cur = ""; }
        else if (c === "\n" || c === "\r") {
          if (cur || row.length) { row.push(cur); rows.push(row); row = []; cur = ""; }
          if (c === "\r" && text[i + 1] === "\n") i++;
        } else cur += c;
      }
      if (cur || row.length) { row.push(cur); rows.push(row); }
      return rows.filter((r) => r.length && r.some((cell) => cell.trim()));
    }

    function parseCSV(text) {
      const rows = parseCSVRows(text);
      const headers = rows.shift()?.map((s) => s.trim()) || [];
      const expected = ["date", "exercise", "set_number", "reps", "weight_lb", "rpe", "notes"];
      if (!expected.every((item) => headers.includes(item))) {
        throw new Error("CSV headers must include date,exercise,set_number,reps,weight_lb,rpe,notes");
      }
      return rows.map((cells, index) => {
        const record = Object.fromEntries(headers.map((key, i) => [key, (cells[i] || "").trim()]));
        const errors = [];
        if (!/^\d{4}-\d{2}-\d{2}$/.test(record.date)) errors.push("bad ISO date");
        if (!record.exercise) errors.push("missing exercise");
        if (!Number(record.set_number)) errors.push("bad set_number");
        if (!Number(record.reps)) errors.push("bad reps");
        if (!Number(record.weight_lb)) errors.push("bad weight_lb");
        return {
          row: index + 2,
          record: {
            ...record,
            set_number: Number(record.set_number),
            reps: Number(record.reps),
            weight_lb: Number(record.weight_lb)
          },
          errors
        };
      });
    }

    // Pure -- does NOT mutate state. New exercises are flagged for creation at commit time.
    function previewCSV(state, text) {
      const rows = parseCSV(text).map((item) => {
        if (item.errors.length) {
          return { row: item.row, record: item.record, status: "errored", message: item.errors.join("; ") };
        }
        const existingExercise = state.exercises.find((e) => normalizeText(e.name) === normalizeText(item.record.exercise));
        const id = csvRecordId(item.record);
        const existingSet = state.sets.find((s) => csvRecordId(s) === id);
        return {
          row: item.row,
          record: {
            ...item.record,
            exercise_id: existingExercise?.id || null,
            needs_new_exercise: !existingExercise
          },
          status: existingSet ? "changed" : "added",
          message: ""
        };
      });
      return {
        rows,
        added: rows.filter((r) => r.status === "added").length,
        changed: rows.filter((r) => r.status === "changed").length,
        unchanged: rows.filter((r) => r.status === "unchanged").length,
        errored: rows.filter((r) => r.status === "errored").length
      };
    }

    function commitCSVImport(updateState) {
      updateState((state) => {
        if (!state.csvPreview || state.csvPreview.errored) return;
        state.csvPreview.rows
          .filter((r) => r.status !== "unchanged" && r.status !== "errored")
          .forEach((row) => {
            const record = row.record;
            let exerciseId = record.exercise_id;
            if (record.needs_new_exercise || !exerciseId) {
              const exercise = createExercise({ name: record.exercise });
              state.exercises.push(exercise);
              exerciseId = exercise.id;
            }
            const session = getOrCreateImportedSession(state, record.date);
            const id = csvRecordId(record);
            const existingIndex = state.sets.findIndex((s) => csvRecordId(s) === id);
            const payload = {
              id: existingIndex >= 0 ? state.sets[existingIndex].id : cryptoId(),
              session_id: session.id,
              date: record.date,
              exercise_id: exerciseId,
              exercise: record.exercise,
              set_number: Number(record.set_number),
              reps: Number(record.reps),
              weight_lb: Number(record.weight_lb),
              rpe: record.rpe,
              notes: record.notes,
              time_logged: record.time_logged || "",
              created_at: existingIndex >= 0 ? state.sets[existingIndex].created_at : nowISO(),
              updated_at: nowISO()
            };
            if (existingIndex >= 0) state.sets[existingIndex] = payload;
            else state.sets.push(payload);
          });
        state.csvPreview = null;
      });
    }

    // Imported sessions are tagged as imports, NOT to the currently-active day.
    function getOrCreateImportedSession(state, date) {
      let session = state.sessions.find((s) => s.date === date && s.imported);
      if (!session) {
        const now = nowISO();
        session = {
          id: cryptoId(),
          date,
          imported: true,
          session_start: now,
          started_at: now,
          updated_at: now,
          paused_total_ms: 0,
          paused_at: null,
          manual_duration_ms: null,
          manual_duration_set_at: null,
          notes: ""
        };
        state.sessions.push(session);
      }
      return session;
    }

    async function importJSONFile(event, updateState, showToast) {
      const file = event.currentTarget.files?.[0];
      event.currentTarget.value = "";
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        updateState(() => normalizeState(parsed.state || parsed));
        showToast("JSON import complete.");
      } catch {
        showToast("JSON import failed.");
      }
    }

    async function importCSVFile(event, updateState, showToast) {
      const file = event.currentTarget.files?.[0];
      event.currentTarget.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        // Read-only preview: do NOT mutate exercises here.
        updateState((draft) => { draft.csvPreview = previewCSV(draft, text); }, { localOnly: true });
      } catch (error) {
        showToast(error.message);
      }
    }

    function backupPayload(state) {
      return JSON.stringify({ app: "K3VSYNC", version: 3, exported_at: nowISO(), state: { ...state, csvPreview: null } }, null, 2);
    }

    // --- Standards rendering helpers ---
    function bestE1RMForModel(state, model) {
      const ids = new Set(model.aliases);
      return Math.max(0, ...state.sets
        .filter((set) => ids.has(set.exercise_id) || model.aliases.some((alias) => normalizeText(set.exercise).includes(normalizeText(alias))))
        .map(e1rm));
    }

    function currentStandardLevel(value, standards) {
      return standards.filter((row) => value >= row.one_rm_lb).slice(-1)[0]?.level || "below untrained";
    }

    function trendPoints(sets) {
      const byDate = new Map();
      sets.forEach((set) => {
        const value = e1rm(set);
        const previous = byDate.get(set.date);
        if (!previous || value > previous.e1rm) {
          byDate.set(set.date, { date: set.date, time: new Date(`${set.date}T12:00:00`).getTime(), e1rm: value });
        }
      });
      return [...byDate.values()].sort((a, b) => a.time - b.time);
    }

    function calculatePlates(weight) {
      const remaining = (Number(weight) - BAR_WEIGHT) / 2;
      if (!Number.isFinite(remaining) || remaining < 0) return { loadable: false, perSide: 0, plates: [] };
      let left = remaining;
      const plates = [];
      PLATES.forEach((plate) => {
        while (left + 0.001 >= plate) { plates.push(plate); left -= plate; }
      });
      return { loadable: true, perSide: remaining, plates, leftover: left };
    }

    // --- Components ---
    function Trendline({ exercise, sets }) {
      const points = trendPoints(sets);
      if (!points.length) return h("div", { class: "empty" }, "Log sets to build a PR trendline.");
      const width = 520, height = 190, pad = 24;
      const minY = Math.min(...points.map((p) => p.e1rm)) * 0.94;
      const maxY = Math.max(...points.map((p) => p.e1rm)) * 1.04 || 1;
      const minX = Math.min(...points.map((p) => p.time));
      const maxX = Math.max(...points.map((p) => p.time));
      const x = (p) => maxX === minX ? width / 2 : pad + ((p.time - minX) / (maxX - minX)) * (width - pad * 2);
      const y = (p) => height - pad - ((p.e1rm - minY) / Math.max(1, maxY - minY)) * (height - pad * 2);
      const d = points.map((p, i) => `${i ? "L" : "M"}${x(p).toFixed(1)} ${y(p).toFixed(1)}`).join(" ");
      let best = 0;
      const prPoints = points.filter((p) => { if (p.e1rm > best) { best = p.e1rm; return true; } return false; });
      return h("svg", { class: "trend-svg", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `${exercise.name} PR trendline` },
        h("path", { d: `M${pad} ${height - pad}H${width - pad}M${pad} ${pad}V${height - pad}`, fill: "none", stroke: "#3d4b5d", "stroke-width": "1" }),
        h("path", { d, fill: "none", stroke: "#8fb7ff", "stroke-width": "3", "stroke-linecap": "round", "stroke-linejoin": "round" }),
        points.map((p) => h("circle", { key: `${p.date}-${p.e1rm}`, cx: x(p), cy: y(p), r: 3, fill: "#f5f8fc" })),
        prPoints.map((p) => h("g", { key: `pr-${p.date}-${p.e1rm}` },
          h("circle", { cx: x(p), cy: y(p), r: 6, fill: "#74e6ad", stroke: "#0e1116", "stroke-width": "2" }),
          h("text", { x: Math.min(width - 76, x(p) + 8), y: Math.max(14, y(p) - 8), fill: "#74e6ad", "font-size": "11", "font-weight": "800" }, `PR ${Math.round(p.e1rm)}`)
        )),
        h("text", { x: pad, y: 14, fill: "#9ca9b8", "font-size": "11" }, `${Math.round(maxY)} lb`),
        h("text", { x: pad, y: height - 5, fill: "#9ca9b8", "font-size": "11" }, `${Math.round(minY)} lb`)
      );
    }

    function PlateModal({ weight, onClose }) {
      const target = Number(weight) || BAR_WEIGHT;
      const result = calculatePlates(target);
      return h(Modal, { title: "Plate Calculator", onClose },
        h("div", { class: "stack" },
          h("p", { class: "muted" }, `Target: ${formatWeight(target)} on a 45 lb bar.`),
          h("div", { class: "panel", style: "padding:12px" },
            h("h3", null, result.loadable ? `${result.perSide} lb per side` : "Below bar weight"),
            h("p", { class: "muted" }, result.loadable
              ? `Each side: ${result.plates.length ? result.plates.join(" + ") : "no plates"}`
              : "Use the empty bar or a lighter implement."
            )
          ),
          h("button", { class: "primary-btn", type: "button", onClick: onClose }, "Done")
        )
      );
    }

    function Modal({ title, onClose, children }) {
      return h("div", { class: "modal-backdrop", onClick: (e) => e.target === e.currentTarget && onClose() },
        h("div", { class: "modal-panel" },
          h("div", { class: "modal-head" },
            h("h2", null, title),
            h("button", { class: "mini-btn", type: "button", onClick: onClose }, "X")
          ),
          children
        )
      );
    }

    function FieldInput({ label, value, onInput, inputMode, placeholder }) {
      return h("div", { class: "field" },
        h("label", null, label),
        h("input", { value: value ?? "", inputMode, placeholder, onInput: (e) => onInput(e.currentTarget.value) })
      );
    }

    function FieldSelect({ label, value, options, onChange }) {
      return h("div", { class: "field" },
        h("label", null, label),
        h("select", { value, onChange: (e) => onChange(e.currentTarget.value) },
          options.map((option) => h("option", { key: option, value: option }, option))
        )
      );
    }



    // --- Main app ---
    function K3V_App() {
      const [state, setState] = useState(null);
      const [syncStatus, setSyncStatus] = useState({ state: "idle", label: "Local" });
      const [toast, setToast] = useState("");
      const [modal, setModal] = useState(null);
      const [clock, setClock] = useState(Date.now());
      const [listening, setListening] = useState(false);
      const recognitionRef = useRef(null);
      const stateRef = useRef(null);
      const fileJsonRef = useRef(null);
      const fileCsvRef = useRef(null);

      useEffect(() => {
        K3V_Storage.load().then((loaded) => {
          stateRef.current = loaded;
          setState(loaded);
        });
        registerServiceWorker();
      }, []);

      // Single ticking clock drives every elapsed display. Uses timeout instead of a plain interval
      // so it re-arms cleanly after tab sleep, phone lock, or browser throttling.
      useEffect(() => {
        let stopped = false;
        let timerId = 0;
        const tick = () => {
          if (stopped) return;
          setClock(Date.now());
          timerId = setTimeout(tick, 1000);
        };
        const wake = () => setClock(Date.now());
        timerId = setTimeout(tick, 250);
        window.addEventListener("focus", wake);
        document.addEventListener("visibilitychange", wake);
        return () => {
          stopped = true;
          clearTimeout(timerId);
          window.removeEventListener("focus", wake);
          document.removeEventListener("visibilitychange", wake);
        };
      }, []);



      // Sync triggers on connectivity & visibility changes (no auto-pause -- user controls pause).
      useEffect(() => {
        const online = () => stateRef.current && K3V_SyncEngine.schedule(stateRef.current, callbacks(), 250);
        const visible = () => !document.hidden && stateRef.current && K3V_SyncEngine.schedule(stateRef.current, callbacks(), 300);
        const pageHide = () => {
          if (stateRef.current) {
            K3V_Storage.saveImmediate(stateRef.current);
            K3V_SyncEngine.run(stateRef.current, callbacks(), { silent: true }).catch(() => {});
          }
        };
        window.addEventListener("online", online);
        document.addEventListener("visibilitychange", visible);
        window.addEventListener("pagehide", pageHide);
        return () => {
          window.removeEventListener("online", online);
          document.removeEventListener("visibilitychange", visible);
          window.removeEventListener("pagehide", pageHide);
        };
      }, []);

      function callbacks() {
        return { onState: applyRemoteState, onStatus: setSyncStatus, onToast: showToast };
      }

      function showToast(message) {
        setToast(message);
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => setToast(""), 2600);
      }

      function applyRemoteState(next, options = {}) {
        const normalized = normalizeState(next);
        stateRef.current = normalized;
        setState(normalized);
        K3V_Storage.save(normalized);
        if (!options.localOnly) K3V_SyncEngine.schedule(normalized, callbacks());
      }

      function updateState(mutator, options = {}) {
        setState((previous) => {
          const base = cloneState(previous || createDefaultState());
          const next = mutator(base) || base;
          const normalized = normalizeState(next);
          stateRef.current = normalized;
          K3V_Storage.save(normalized);

    function LogView({ state, updateState, showToast, openModal, clock, listening, setListening, recognitionRef }) {
      const day = getDay(state);
      const blocks = useMemo(() => (day?.blocks || []).slice().sort(byOrder), [day]);
      // Index sets by exercise+date once so each block can do an O(1) lookup.
      const setsByExercise = useMemo(() => {
        const map = new Map();
        for (const s of state.sets) {
          if (s.date !== state.activeDate) continue;
          if (!map.has(s.exercise_id)) map.set(s.exercise_id, []);
          map.get(s.exercise_id).push(s);
        }
        for (const arr of map.values()) arr.sort(sortRecords);
        return map;
      }, [state.sets, state.activeDate]);
      return h("section", { class: "stack" },
        h(SessionPanel, { state, updateState, clock, showToast, openModal }),
        h(VoicePanel, { state, updateState, showToast, listening, setListening, recognitionRef }),
        blocks.length
          ? blocks.map((block) => h(ExerciseBlock, {
              key: block.id, state, block, updateState, showToast, openModal,
              logs: setsByExercise.get(block.exercise_id) || []
            }))
          : h("div", { class: "empty panel" }, "No exercises on this day yet. Add blocks from Plan.")
      );
    }

      const commitDuration = (ms) => {
        updateState((draft) => {
          const active = activeSession(draft);
          bump(active, { manual_duration_ms: Math.max(0, ms), manual_duration_set_at: nowISO() });
          draft.sessionTimeDraft = "";
        });
        setDisplayMs(Math.max(0, ms));

                h("button", { class: "ghost-btn", type: "button", onClick: () => {
                  const ms = parseDurationInput(timeDraft);

    function renderStandards(state) {
      const sex = state.profile.sex || "male";
      const bodyweight = Number(state.profile.bodyweight_lb) || 180;
      const age = Number(state.profile.age) || 30;
      const bracket = nearest(bodyweightBrackets, bodyweight);
      const ageBracket = ageToBracket(age);
      return Object.entries(strengthStandardModels).map(([liftId, model]) => {
        const standards = STRENGTH_STANDARDS.filter((row) =>
          row.lift_id === liftId && row.sex === sex
          && row.bodyweight_bracket_lb === bracket && row.age_bracket === ageBracket
        );
        const best = bestE1RMForModel(state, model);
        const elite = standards.find((row) => row.level === "elite")?.one_rm_lb || 1;
        const position = Math.min(100, Math.max(0, best ? (best / elite) * 100 : 0));
        const level = best ? currentStandardLevel(best, standards) : "no data";
        return h("article", { key: liftId, class: "panel", style: "padding:12px" },
          h("div", { class: "chart-head" },
            h("b", null, model.lift),
            h("span", { class: "muted" }, best ? `${Math.round(best)} lb / ${level}` : "no data")
          ),
          h("div", { class: "standard-bar" }, h("span", { class: "standard-marker", style: `left:calc(${position}% - 2px)` })),
          h("p", { class: "muted" }, `${sex} / ${bracket} lb / age ${ageBracket}`)
        );
      });
    }
